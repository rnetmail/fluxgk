/* ===== color.js ===== */
/* =============================================================
   MATEMÁTICA DE COR
   Conversões OKLab/OKLCH, simulação de daltonismo (Machado,
   Oliveira & Fernandes 2009), contraste WCAG e ajuste de
   luminosidade — usado para derivar a paleta a partir das
   cores do clube sem perder legibilidade.
   ============================================================= */
(function () {
  'use strict';

  const BAND = { light: [0.43, 0.77], dark: [0.48, 0.67] };
  const CHROMA_FLOOR = 0.10;
  const CVD_TARGET = 8.0, CVD_FLOOR = 6.0;
  const NORMAL_FLOOR = 15.0;
  const CONTRAST_MIN = 3.0;
  const SURFACE = { light: '#fcfcfb', dark: '#1a1a19' };

  const MACHADO = {
    protan: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
    deutan: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]],
    tritan: [[1.255528, -0.076749, -0.178779], [-0.078411, 0.930809, 0.147602], [0.004733, 0.691367, 0.303900]]
  };

  const isHex = v => /^#?[0-9a-fA-F]{6}$/.test(String(v || '').trim());
  const norm = h => '#' + String(h).trim().replace(/^#/, '').toLowerCase();
  const hex2srgb = h => { h = String(h).trim().replace(/^#/, ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); };
  const s2lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const lin2s = c => { c = Math.max(0, Math.min(1, c)); return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; };
  const lin = h => hex2srgb(h).map(s2lin);
  const relLum = h => { const [r, g, b] = lin(h); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };

  function contrast(a, b) {
    const x = relLum(a), y = relLum(b);
    const hi = Math.max(x, y), lo = Math.min(x, y);
    return (hi + 0.05) / (lo + 0.05);
  }

  function oklabFromLin(rgb) {
    const [r, g, b] = rgb;
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    ];
  }
  const oklab = h => oklabFromLin(lin(h));
  function oklch(h) {
    const [L, a, b] = oklab(h);
    return { L, C: Math.hypot(a, b), H: ((Math.atan2(b, a) * 180 / Math.PI) % 360 + 360) % 360 };
  }

  function linFromOklab(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
  }
  const inGamut = rgb => rgb.every(c => c >= -0.0008 && c <= 1.0008);

  /* OKLCH → hex, reduzindo o croma até caber no gamut sRGB */
  function lch2hex(L, C, H) {
    const rad = H * Math.PI / 180;
    let lo = 0, hi = C, best = null;
    for (let i = 0; i < 24; i++) {
      const c = (lo + hi) / 2;
      const rgb = linFromOklab(L, c * Math.cos(rad), c * Math.sin(rad));
      if (inGamut(rgb)) { best = rgb; lo = c; } else hi = c;
    }
    if (!best) best = linFromOklab(L, 0, 0);
    return '#' + best.map(c => Math.round(lin2s(c) * 255).toString(16).padStart(2, '0')).join('');
  }

  function simulate(h, kind) {
    const [r, g, b] = lin(h), M = MACHADO[kind];
    const cl = c => Math.max(0, Math.min(1, c));
    return [cl(M[0][0] * r + M[0][1] * g + M[0][2] * b),
    cl(M[1][0] * r + M[1][1] * g + M[1][2] * b),
    cl(M[2][0] * r + M[2][1] * g + M[2][2] * b)];
  }
  function deltaE(h1, h2, kind) {
    const a = oklabFromLin(kind ? simulate(h1, kind) : lin(h1));
    const b = oklabFromLin(kind ? simulate(h2, kind) : lin(h2));
    return 100 * Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  }
  const cvdGap = (a, b) => Math.min(deltaE(a, b, 'protan'), deltaE(a, b, 'deutan'));

  /* ---------------------------------------------------------------
     Ajusta uma cor para a faixa de luminosidade do modo, preservando
     matiz. É assim que a mesma cor do clube ganha uma versão que
     funciona no tema claro e outra no escuro.
     --------------------------------------------------------------- */
  const NEUTRAL_C = 0.035;
  const isNeutral = hex => isHex(hex) && oklch(norm(hex)).C < NEUTRAL_C;

  function snapToBand(hex, mode) {
    if (!isHex(hex)) return null;
    const { L, C, H } = oklch(norm(hex));
    const [lo, hi] = BAND[mode];
    // cor sem matiz (branco, preto, cinza): devolve um cinza da faixa,
    // nunca inventa um tom colorido a partir de ruído numérico
    if (C < NEUTRAL_C) {
      const g = mode === 'light' ? 0.55 : 0.60;
      return lch2hex(g, 0, 0);
    }
    const target = Math.max(lo + 0.01, Math.min(hi - 0.01, L));
    const c = Math.max(C, CHROMA_FLOOR + 0.01);
    let out = lch2hex(target, c, H);
    let guard = 0;
    while (contrast(out, SURFACE[mode]) < CONTRAST_MIN && guard++ < 14) {
      const cur = oklch(out).L;
      const nl = mode === 'light' ? Math.max(lo, cur - 0.025) : Math.min(hi, cur + 0.025);
      if (Math.abs(nl - cur) < 0.001) break;
      out = lch2hex(nl, c, H);
    }
    return out;
  }

  /* cor de texto legível sobre um fundo sólido */
  const onColor = hex => contrast(hex, '#ffffff') >= 3.6 ? '#ffffff' : '#111111';

  /* ---------------------------------------------------------------
     Extração das cores dominantes de uma imagem (o escudo).
     Ignora pixels transparentes, quase brancos, quase pretos e
     cinzentos — o que sobra são as cores de identidade.
     --------------------------------------------------------------- */
  function extractFromImage(img, max) {
    max = max || 3;
    const S = 120;
    const cv = document.createElement('canvas');
    const scale = Math.min(1, S / Math.max(img.width, img.height));
    cv.width = Math.max(1, Math.round(img.width * scale));
    cv.height = Math.max(1, Math.round(img.height * scale));
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;

    const bins = {};
    for (let i = 0; i < d.length; i += 4) {
      const al = d[i + 3];
      if (al < 200) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const sat = mx === 0 ? 0 : (mx - mn) / mx;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      if (lum > 0.94 || lum < 0.06) continue;   // fundo branco / contorno preto
      if (sat < 0.18 && lum > 0.2 && lum < 0.85) continue; // cinzentos
      const key = [Math.round(r / 26), Math.round(g / 26), Math.round(b / 26)].join(',');
      const e = bins[key] || (bins[key] = { n: 0, r: 0, g: 0, b: 0 });
      e.n++; e.r += r; e.g += g; e.b += b;
    }
    let list = Object.values(bins).map(e => ({
      n: e.n,
      hex: '#' + [e.r / e.n, e.g / e.n, e.b / e.n].map(c => Math.round(c).toString(16).padStart(2, '0')).join('')
    })).sort((a, b) => b.n - a.n);

    // remove cores muito parecidas entre si
    const out = [];
    for (const c of list) {
      if (out.length >= max) break;
      if (out.every(o => deltaE(o.hex, c.hex) > 14)) out.push(c);
    }
    return out.map(o => o.hex);
  }

  /* ---------------------------------------------------------------
     Monta os 8 slots de série a partir das cores do clube,
     completando com a paleta padrão e descartando os tons que
     ficariam confundíveis com os do clube.
     --------------------------------------------------------------- */
  const DEFAULTS = {
    light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'],
    dark: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767']
  };

  /* pontuação normalizada: quão separada uma cor candidata está das já escolhidas */
  function sepScore(cand, chosen) {
    let worst = Infinity;
    for (const c of chosen) {
      const s1 = cvdGap(cand, c) / CVD_FLOOR;
      const s2 = deltaE(cand, c) / NORMAL_FLOOR;
      worst = Math.min(worst, s1, s2);
    }
    return chosen.length ? worst : Infinity;
  }

  /* pool de candidatos: a paleta padrão mais matizes gerados de 10 em 10 graus */
  function candidatePool(mode) {
    const [lo, hi] = BAND[mode];
    const mid = (lo + hi) / 2;
    const pool = DEFAULTS[mode].slice();
    for (let H = 0; H < 360; H += 10) {
      const c = lch2hex(mid, 0.15, H);
      if (contrast(c, SURFACE[mode]) >= CONTRAST_MIN) pool.push(c);
    }
    return pool;
  }

  /* ---------------------------------------------------------------
     Monta os 8 slots de série. Sem cores de clube, devolve a paleta
     padrão intacta. Com elas, escolhe as demais por busca gulosa:
     a cada passo entra a cor mais distante de todas as já escolhidas.
     --------------------------------------------------------------- */
  function buildSeries(clubColors, mode) {
    const club = (clubColors || [])
      .filter(c => isHex(c) && !isNeutral(c))
      .map(c => snapToBand(c, mode))
      .filter(Boolean);
    if (!club.length) return DEFAULTS[mode].slice();

    const slots = [];
    club.forEach(c => { if (sepScore(c, slots) >= 1) slots.push(c); });
    if (!slots.length) slots.push(club[0]);

    const pool = candidatePool(mode);
    while (slots.length < 8) {
      let best = null, bestScore = -1, bestIsDefault = false;
      for (const c of pool) {
        if (slots.indexOf(c) >= 0) continue;
        const sc = sepScore(c, slots);
        const isDef = DEFAULTS[mode].indexOf(c) >= 0;
        // empate técnico: prefere a cor da paleta padrão, por estética
        if (sc > bestScore * 1.02 || (isDef && !bestIsDefault && sc > bestScore * 0.98)) {
          best = c; bestScore = Math.max(bestScore, sc); bestIsDefault = isDef;
        }
      }
      if (!best) break;
      slots.push(best);
    }
    return slots.slice(0, 8);
  }

  /* Relatório de legibilidade dos primeiros n slots */
  function audit(slots, mode, n) {
    n = Math.min(n || slots.length, slots.length);
    const use = slots.slice(0, n);
    let worstCvd = Infinity, worstNormal = Infinity, pairCvd = null, pairNormal = null;
    for (let i = 0; i < use.length; i++) {
      for (let j = i + 1; j < use.length; j++) {
        const c = cvdGap(use[i], use[j]);
        const d = deltaE(use[i], use[j]);
        if (c < worstCvd) { worstCvd = c; pairCvd = [use[i], use[j]]; }
        if (d < worstNormal) { worstNormal = d; pairNormal = [use[i], use[j]]; }
      }
    }
    const lowContrast = use.filter(c => contrast(c, SURFACE[mode]) < CONTRAST_MIN);
    return {
      mode, n: use.length,
      cvd: use.length > 1 ? worstCvd : Infinity, cvdPair: pairCvd,
      normal: use.length > 1 ? worstNormal : Infinity, normalPair: pairNormal,
      lowContrast,
      level: use.length < 2 ? 'ok'
        : (worstNormal < NORMAL_FLOOR || worstCvd < CVD_FLOOR) ? 'bad'
          : worstCvd < CVD_TARGET ? 'warn' : 'ok'
    };
  }

  window.ColorKit = {
    isHex, norm, contrast, oklch, lch2hex, deltaE, cvdGap,
    snapToBand, onColor, extractFromImage, buildSeries, audit, isNeutral,
    DEFAULTS, SURFACE, THRESHOLDS: { CVD_TARGET, CVD_FLOOR, NORMAL_FLOOR, CONTRAST_MIN }
  };
})();


/* ===== model.js ===== */
/* =============================================================
   MODELO DE AVALIAÇÃO
   Eixos, competências e escala deixaram de ser fixos no código:
   são dados, guardados no banco e editáveis pelo treinador.
   O conteúdo que veio de fábrica está em COMPETENCIAS (i18n.js)
   e serve apenas de ponto de partida.
   ============================================================= */
(function () {
  'use strict';

  const LANGS = ['pt', 'en', 'ru'];
  const MAXAXES = 8;

  /* nota 0 significa sempre "não avaliado", qualquer que seja a escala */
  const NOT_RATED = 0;

  function uid(prefix) {
    return (prefix || 'x') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const NIVEIS_PADRAO = {
    5: [
      { pt: 'Abaixo do exigido para o nível', en: 'Below the level required', ru: 'Ниже требуемого уровня' },
      { pt: 'Em desenvolvimento inicial', en: 'Early development', ru: 'Начальное развитие' },
      { pt: 'Em desenvolvimento', en: 'Developing', ru: 'В развитии' },
      { pt: 'Consolidado', en: 'Consolidated', ru: 'Закреплено' },
      { pt: 'Referência na equipe', en: 'Team benchmark', ru: 'Эталон в команде' }
    ]
  };

  /* modelo de fábrica, montado a partir do dicionário original */
  function factory() {
    const axes = ['A', 'B', 'C'].map((k, i) => {
      const c = COMPETENCIAS[k];
      return {
        id: k,
        label: Object.assign({}, c.label),
        short: Object.assign({}, c.short),
        micro: Object.assign({}, c.micro),
        items: c.items.map(it => ({
          id: it.id,
          pt: it.pt, en: it.en, ru: it.ru
        }))
      };
    });
    return {
      v: 1,
      scale: { min: 1, max: 5 },
      levels: NIVEIS_PADRAO[5].map((l, i) => ({ v: i + 1, label: Object.assign({}, l) })),
      axes
    };
  }

  /* preenche o que estiver faltando, para um modelo vindo do banco
     nunca quebrar a aplicação */
  function normalize(m) {
    const base = factory();
    if (!m || typeof m !== 'object') return base;
    const out = {
      v: 1,
      scale: {
        min: clampInt(m.scale && m.scale.min, 0, 9, 1),
        max: clampInt(m.scale && m.scale.max, 2, 100, 5)
      },
      levels: [],
      axes: []
    };
    if (out.scale.max <= out.scale.min) out.scale.max = out.scale.min + 1;

    const axes = Array.isArray(m.axes) ? m.axes : base.axes;
    /* "Curto" e "Mínimo" nao sao mais campos da tela: derivam do nome do eixo.
       Assim os modelos ja gravados param de mostrar "New axis N" nos graficos
       e no PDF sem precisar reabrir e salvar os criterios. */
    const abrev = txt => {
      const s2 = String(txt || '').trim();
      if (!s2) return '';
      const p = s2.split(/\s+/).filter(w => w.length > 2 || /^[0-9]/.test(w));
      if (p.length >= 2) return p.slice(0, 3).map(w => w[0]).join('').toUpperCase();
      return s2.slice(0, 3).toUpperCase();
    };
    out.axes = axes.slice(0, MAXAXES).map((a, i) => ({
      id: a && a.id ? String(a.id) : uid('ax'),
      label: tri(a && a.label, 'Eixo ' + (i + 1)),
      short: tri(a && a.label, 'Eixo ' + (i + 1)),
      micro: (function () {
        const L2 = tri(a && a.label, 'Eixo ' + (i + 1));
        return { pt: abrev(L2.pt), en: abrev(L2.en), ru: abrev(L2.ru) };
      })(),
      items: (Array.isArray(a && a.items) ? a.items : []).map((it, k) => ({
        id: it && it.id ? String(it.id) : uid('it'),
        pt: str(it && it.pt, 'Item ' + (k + 1)),
        en: str(it && it.en, str(it && it.pt, 'Item ' + (k + 1))),
        ru: str(it && it.ru, str(it && it.pt, 'Item ' + (k + 1)))
      }))
    }));
    if (!out.axes.length) out.axes = base.axes;

    const n = out.scale.max - out.scale.min + 1;
    const src = Array.isArray(m.levels) ? m.levels : [];
    for (let i = 0; i < n; i++) {
      const v = out.scale.min + i;
      const found = src.find(l => +l.v === v);
      const def = (NIVEIS_PADRAO[n] && NIVEIS_PADRAO[n][i]) || null;
      out.levels.push({ v, label: tri(found && found.label, def ? def.pt : '') });
      if (def && !(found && found.label)) out.levels[i].label = Object.assign({}, def);
    }
    return out;
  }

  function clampInt(v, lo, hi, dflt) {
    const n = parseInt(v, 10);
    if (isNaN(n)) return dflt;
    return Math.max(lo, Math.min(hi, n));
  }
  function str(v, dflt) {
    const s = String(v == null ? '' : v).trim();
    return s || dflt || '';
  }
  function tri(obj, dflt) {
    const o = {};
    LANGS.forEach(l => { o[l] = str(obj && obj[l], dflt); });
    return o;
  }

  /* ---------- consultas ---------- */
  const axes = m => (m && m.axes) || [];
  const axisById = (m, id) => axes(m).find(a => a.id === id) || null;
  const allItems = m => axes(m).flatMap(a => a.items.map(i => ({ ...i, axis: a.id })));
  const colorOf = (m, axisId) => {
    const i = axes(m).findIndex(a => a.id === axisId);
    return i < 0 ? 1 : (i % 8) + 1;
  };
  const label = (a, lang, kind) => (a && a[kind || 'label'] && a[kind || 'label'][lang]) || '';
  const itemLabel = (it, lang) => (it && it[lang]) || it.pt || '';

  function axisAvg(m, axisId, scores) {
    const a = axisById(m, axisId); if (!a) return 0;
    const v = a.items.map(i => +(scores || {})[i.id] || 0).filter(x => x > NOT_RATED);
    return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0;
  }
  function globalAvg(m, scores) {
    const v = allItems(m).map(i => +(scores || {})[i.id] || 0).filter(x => x > NOT_RATED);
    return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0;
  }

  /* ---------- escala ---------- */
  const scaleMax = m => (m && m.scale && m.scale.max) || 5;
  const scaleMin = m => (m && m.scale && m.scale.min) || 1;

  /* marcas do eixo Y de um gráfico, no máximo 6 */
  function ticks(m) {
    const max = scaleMax(m);
    const step = max <= 5 ? 1 : max <= 10 ? 2 : Math.ceil(max / 5);
    const out = [];
    for (let v = 0; v <= max; v += step) out.push(v);
    if (out[out.length - 1] !== max) out.push(max);
    return out;
  }

  /* converte uma nota entre escalas, preservando 0 = não avaliado */
  function convert(v, from, to) {
    const n = +v || 0;
    if (n <= NOT_RATED) return 0;
    if (!from || !to || (from.min === to.min && from.max === to.max)) return n;
    const spanFrom = Math.max(1, from.max - from.min);
    const spanTo = Math.max(1, to.max - to.min);
    const rel = (Math.max(from.min, Math.min(from.max, n)) - from.min) / spanFrom;
    return Math.max(to.min, Math.min(to.max, Math.round(to.min + rel * spanTo)));
  }
  function convertScores(scores, from, to) {
    const out = {};
    Object.keys(scores || {}).forEach(k => { out[k] = convert(scores[k], from, to); });
    return out;
  }

  /* itens que existem em notas antigas mas não no modelo atual */
  function orphanIds(m, scores) {
    const known = new Set(allItems(m).map(i => i.id));
    return Object.keys(scores || {}).filter(k => !known.has(k) && (+scores[k] || 0) > 0);
  }

  window.ModelKit = {
    LANGS, MAXAXES, NOT_RATED, NIVEIS_PADRAO,
    factory, normalize, uid,
    axes, axisById, allItems, colorOf, label, itemLabel,
    axisAvg, globalAvg,
    scaleMin, scaleMax, ticks, convert, convertScores, orphanIds
  };
})();


/* ===== charts.js ===== */
/* =============================================================
   GRÁFICOS EM SVG
   Paleta validada para daltonismo em modo claro e escuro.
   ============================================================= */
(function () {
  'use strict';

  // ordem fixa de cores (nunca cíclica): azul, laranja, verde-água,
  // amarelo, magenta, verde, violeta, vermelho
  const SLOTS = 8;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const seriesColor = i => `var(--series-${(i % SLOTS) + 1})`;

  /* ---------------- gráfico de linhas com escala de tempo ---------------- */
  /* series: [{ label, color, points:[{t:Date|ISO, y:Number}] }]            */
  function multiLine(series, opts) {
    opts = opts || {};
    const W = opts.width || 760;
    const H = opts.height || 300;
    const nameLab = !!opts.nameLabels;
    const longest = nameLab ? series.reduce((m, s) => Math.max(m, (s.short || s.label || '').length), 0) : 0;
    const PL = 42, PR = opts.padRight || (nameLab ? Math.min(190, 46 + longest * 6.6) : 54), PT = 14, PB = 38;
    const iw = W - PL - PR, ih = H - PT - PB;
    const yMax = opts.yMax || 10;
    const yTicks = opts.ticks || [0, 2, 4, 6, 8, 10].filter(v => v <= yMax);
    const fmtX = opts.formatX || (d => d.toISOString().slice(0, 10));

    const all = [];
    series.forEach(s => s.points.forEach(p => all.push(+new Date(p.t))));
    if (!all.length) return '';
    let t0 = Math.min.apply(null, all), t1 = Math.max.apply(null, all);
    if (t0 === t1) { t0 -= 86400000; t1 += 86400000; }

    const x = t => PL + ((+new Date(t) - t0) / (t1 - t0)) * iw;
    const y = v => PT + ih - (Math.max(0, Math.min(yMax, v)) / yMax) * ih;

    const grid = yTicks.map(v =>
      `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${PL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v}</text>`
    ).join('');

    // marcas do eixo x: datas distintas presentes nos dados
    const uniq = Array.from(new Set(all)).sort((a, b) => a - b);
    // rótulos do eixo x: sempre o último; os demais só se couberem sem colidir
    const MINGAP = 76;
    const keep = new Array(uniq.length).fill(false);
    if (uniq.length) keep[uniq.length - 1] = true;
    let lastPx = x(uniq[uniq.length - 1]);
    for (let i = uniq.length - 2; i >= 0; i--) {
      const px = x(uniq[i]);
      if (lastPx - px >= MINGAP) { keep[i] = true; lastPx = px; }
    }
    const xlab = uniq.map((t, i) => {
      if (!keep[i]) return '';
      const px = x(t);
      const anchor = px < PL + 26 ? 'start' : px > W - PR - 26 ? 'end' : 'middle';
      return `<text x="${px.toFixed(1)}" y="${H - PB + 19}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)">${esc(fmtX(new Date(t)))}</text>`;
    }).join('');

    // posição dos rótulos finais, sem sobreposição
    const ends = series.map((s, i) => {
      const last = s.points[s.points.length - 1];
      return { i, v: last ? last.y : 0, yy: last ? y(last.y) : 0, x: last ? x(last.t) : 0, s };
    }).filter(e => e.s.points.length).sort((a, b) => a.yy - b.yy);
    let prev = -Infinity;
    ends.forEach(e => { let ly = e.yy + 4; if (ly - prev < 13) ly = prev + 13; e.ly = ly; prev = ly; });
    const labelOf = {};
    ends.forEach(e => labelOf[e.i] = e);

    const paths = series.map((s, i) => {
      const c = s.color || seriesColor(i);
      if (!s.points.length) return '';
      const pts = s.points.map(p => [x(p.t), y(p.y)]);
      const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const dashed = s.dashed ? ' stroke-dasharray="5 4"' : '';
      const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.dashed ? 3 : 4}" fill="${c}" stroke="var(--card)" stroke-width="2"/>`).join('');
      const e = labelOf[i];
      const txt = nameLab ? `${s.short || s.label} ${e ? e.v.toFixed(1) : ''}` : (e ? e.v.toFixed(1) : '');
      const lab = (opts.endLabels === false || !e) ? '' :
        `<text x="${(e.x + 9).toFixed(1)}" y="${e.ly.toFixed(1)}" font-size="11.5" font-weight="640" fill="${c}">${esc(txt)}</text>`;
      return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${dashed}/>${dots}${lab}`;
    }).join('');

    // áreas de captura para o tooltip: uma faixa por data, sem sobreposição,
    // delimitada pelos pontos médios entre datas vizinhas
    const xs = uniq.map(x);
    const hits = uniq.map((t, i) => {
      const left = i === 0 ? PL : (xs[i - 1] + xs[i]) / 2;
      const right = i === uniq.length - 1 ? (W - PR) : (xs[i] + xs[i + 1]) / 2;
      const w = Math.max(1, right - left);
      return `<rect x="${left.toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${ih}" fill="transparent" data-hit="${t}" style="cursor:crosshair"/>`;
    }).join('');

    const id = 'ch' + Math.random().toString(36).slice(2, 8);
    return `<div class="chart-wrap" data-chart="${id}">
      <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="${esc(opts.title || '')}">
        ${grid}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
        ${xlab}${paths}
        <line class="crosshair" x1="0" x2="0" y1="${PT}" y2="${PT + ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
        ${hits}
      </svg>
      <div class="tip"></div>
    </div>`;
  }

  /* liga os tooltips de um gráfico de linhas já inserido no DOM */
  function wireLine(rootEl, series, fmtX) {
    if (!rootEl) return;
    const svg = rootEl.querySelector('svg');
    const tip = rootEl.querySelector('.tip');
    const cross = rootEl.querySelector('.crosshair');
    if (!svg || !tip) return;
    rootEl.querySelectorAll('[data-hit]').forEach(r => {
      r.addEventListener('mouseenter', () => {
        const t = +r.dataset.hit;
        const cx = +r.getAttribute('x') + +r.getAttribute('width') / 2;
        const bb = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
        cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '.55');
        const rows = series.map((s, i) => {
          const p = s.points.find(pt => +new Date(pt.t) === t);
          if (!p) return '';
          return `<div class="tip-row"><i style="background:${s.color || seriesColor(i)}"></i>${esc(s.label)}<b>${p.y.toFixed(1)}</b></div>`;
        }).filter(Boolean).join('');
        if (!rows) return;
        tip.innerHTML = `<div class="tip-head">${esc(fmtX(new Date(t)))}</div>${rows}`;
        tip.style.opacity = '1';
        const px = (cx / vb.width) * bb.width;
        tip.style.left = Math.max(70, Math.min(bb.width - 70, px)) + 'px';
        tip.style.top = '18px';
      });
      r.addEventListener('mouseleave', () => {
        tip.style.opacity = '0'; cross.setAttribute('opacity', '0');
      });
    });
  }

  /* ---------------- barras horizontais agrupadas ----------------
     groups: [{ title, rows:[{ label, values:[Number|null] }] }]
     legend: [{ label, color }]                                     */
  function groupedBars(groups, legend, opts) {
    opts = opts || {};
    const vMax = opts.max || 10;
    const W = opts.width || 820;
    const PL = opts.labelWidth || 268, PR = 44;
    const n = legend.length;
    const barH = n > 1 ? 9 : 13;
    const barGap = 2;
    const rowH = n * (barH + barGap) + 12;
    const iw = W - PL - PR;

    let H = 10, body = '';
    groups.forEach((g, gi) => { H += (g.title ? 24 : 0) + g.rows.length * rowH + (gi ? 8 : 0); });
    H += 8;

    let yy = 8;
    groups.forEach((g, gi) => {
      if (gi) yy += 8;
      if (g.title) {
        body += `<text x="0" y="${yy + 11}" font-size="11" font-weight="660" fill="var(--text-secondary)" letter-spacing=".04em">${esc(g.title.toUpperCase())}</text>`;
        yy += 24;
      }
      g.rows.forEach(r => {
        const label = r.label.length > 40 ? r.label.slice(0, 39) + '…' : r.label;
        body += `<text x="${PL - 10}" y="${yy + rowH / 2 + 3}" text-anchor="end" font-size="11.5" fill="var(--text-primary)">${esc(label)}</text>`;
        r.values.forEach((v, k) => {
          const by = yy + 5 + k * (barH + barGap);
          const c = legend[k].color || seriesColor(k);
          body += `<rect x="${PL}" y="${by}" width="${iw}" height="${barH}" rx="${barH / 2}" fill="var(--grid)" opacity=".5"/>`;
          if (v != null && v > 0) {
            const w = Math.max(3, (v / vMax) * iw);
            body += `<rect x="${PL}" y="${by}" width="${w.toFixed(1)}" height="${barH}" rx="4" fill="${c}"/>`;
          }
          body += `<text x="${PL + iw + 9}" y="${by + barH - 1}" font-size="10.5" font-weight="640"
                     fill="${n > 1 ? c : 'var(--text-primary)'}" font-variant-numeric="tabular-nums">${v ? v.toFixed(v % 1 ? 1 : 0) : '–'}</text>`;
        });
        yy += rowH;
      });
    });

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img">${body}</svg>`;
  }

  function legendHTML(items) {
    return `<div class="legend">` + items.map((it, i) =>
      `<span><i style="background:${it.color || seriesColor(i)}"></i>${esc(it.label)}</span>`).join('') + `</div>`;
  }

  window.Charts = { multiLine, wireLine, groupedBars, legendHTML, seriesColor, SLOTS };
})();


/* ===== fdb.js ===== */
/* =============================================================
   CAMADA DE DADOS — FluxGK / PocketBase (colecao nodes)
   -------------------------------------------------------------
   Convenções do hub, seguidas à risca:

     users/{uid}/data/{clube}/{temporada}/load/players
         elenco — pertence ao Load Control. Aqui é só leitura.

     users/{uid}/data/{clube}/{temporada}/profile/gk/{playerId}
     users/{uid}/data/{clube}/{temporada}/profile/assessments/{playerId}/{data}
     users/{uid}/data/{clube}/{temporada}/profile/log/{playerId}/{id}
         o que este módulo grava, isolado por clube e temporada.

     users/{uid}/library/gkCriteria
         os critérios de avaliação. Atravessam clubes e temporadas,
         pela mesma razão que a biblioteca de exercícios do planner:
         são do treinador, não do clube.
   ============================================================= */
(function () {
  'use strict';

  const SDK = [
    '/static/vendor/pocketbase.umd.js',
    '/static/pocketbase-adapter.js'
  ];

  function loadScript(src) {
    return new Promise((res, rej) => {
      if (document.querySelector(`script[src="${src}"]`)) return res();
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => res();
      s.onerror = () => rej(new Error('SDK: ' + src));
      document.head.appendChild(s);
    });
  }

  let db = null, uid = null, base = null, ready = false;
  const listeners = [];

  /* fila de escrita: o que não subiu fica guardado e sobe quando
     a conexão voltar. O hub faz o mesmo com raceTimeout. */
  const queue = [];
  let flushing = false;

  async function flush() {
    if (flushing || !ready || !queue.length) return;
    flushing = true;
    while (queue.length) {
      const job = queue.shift();
      try { await job(); } catch (e) { console.warn('[perfil] escrita falhou:', e); }
    }
    flushing = false;
  }

  function write(fn) {
    if (!ready) { queue.push(fn); return Promise.resolve('pending'); }
    return fn().then(() => 'saved').catch(e => {
      console.warn('[perfil] escrita falhou:', e);
      queue.push(fn);
      return 'error';
    });
  }

  const dataRef = p => db.ref(base + '/profile/' + p);
  const loadRef = p => db.ref(base + '/load/' + p);
  const libRef = p => db.ref('users/' + uid + '/library/' + p);

  const FDB = {
    get ready() { return ready; },
    get uid() { return uid; },
    get base() { return base; },

    async init(cfg, ctxUid, dataPath) {
      uid = ctxUid; base = dataPath;
      /* o SDK pode já estar na página — outro módulo, ou o próprio hub */
      if (!window.fluxdb) { for (const s of SDK) await loadScript(s); }
      if (!window.fluxdb) throw new Error('PocketBase não carregou.');
      if (!fluxdb.apps.length) fluxdb.initializeApp(cfg);
      db = fluxdb.database();
      return new Promise(res => {
        fluxdb.auth().onAuthStateChanged(u => {
          if (!u) { console.error('[perfil] sem sessão — entre pelo hub.'); return; }
          ready = true;
          flush();
          res(u);
        });
      });
    },

    /* ---------- elenco (somente leitura: dono é o Load Control) ---------- */
    onRoster(cb) {
      const ref = loadRef('players');
      const h = ref.on('value', s => {
        const v = s.val() || {};
        cb(Object.keys(v).map(k => ({
          id: v[k].id || k,
          name: v[k].name || '',
          photo: v[k].photo || null
        })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pt')));
      });
      listeners.push(() => ref.off('value', h));
    },

    /* ---------- perfil do goleiro ---------- */
    onProfiles(cb) {
      const ref = dataRef('gk');
      const h = ref.on('value', s => cb(s.val() || {}));
      listeners.push(() => ref.off('value', h));
    },
    saveProfile(playerId, patch) {
      return write(() => dataRef('gk/' + playerId).update(patch));
    },

    /* ---------- avaliações datadas ---------- */
    onAssessments(cb) {
      const ref = dataRef('assessments');
      const h = ref.on('value', s => cb(s.val() || {}));
      listeners.push(() => ref.off('value', h));
    },
    saveAssessment(playerId, date, scores, note) {
      return write(() => dataRef('assessments/' + playerId + '/' + date)
        .set({ date, scores, note: String(note || '') }));
    },
    deleteAssessment(playerId, date) {
      return write(() => dataRef('assessments/' + playerId + '/' + date).remove());
    },

    /* ---------- diário ---------- */
    onLogs(cb) {
      const ref = dataRef('log');
      const h = ref.on('value', s => cb(s.val() || {}));
      listeners.push(() => ref.off('value', h));
    },
    saveLog(playerId, id, entry) {
      return write(() => dataRef('log/' + playerId + '/' + id).set(entry));
    },
    deleteLog(playerId, id) {
      return write(() => dataRef('log/' + playerId + '/' + id).remove());
    },

    /* ---------- critérios: biblioteca pessoal, fora do clube ---------- */
    onCriteria(cb) {
      const ref = libRef('gkCriteria');
      const h = ref.on('value', s => cb(s.val() || null));
      listeners.push(() => ref.off('value', h));
    },
    saveCriteria(model) {
      return write(() => libRef('gkCriteria').set(model));
    },

    detach() { listeners.splice(0).forEach(off => { try { off(); } catch (e) { } }); }
  };

  window.FDB = FDB;
})();


/* ===== fadapter.js ===== */
/* =============================================================
   ADAPTADOR
   Expõe ao aplicativo a mesma interface que o SemeyDB expunha,
   mas por trás está o PocketBase do FluxGK. As telas não sabem
   que a base mudou.

   Duas diferenças de propriedade, e elas são deliberadas:

   • O ELENCO é do Load Control. Aqui ele é lido, nunca escrito.
     Nome e foto do atleta se editam lá, e este módulo os mostra.
   • Os CRITÉRIOS são do treinador, não do clube: ficam na
     biblioteca pessoal e acompanham você entre clubes.
   ============================================================= */
(function () {
  'use strict';

  /* espelho local mantido pelos listeners do PocketBase */
  const cache = { roster: [], profiles: {}, assessments: {}, logs: {}, model: null };
  let onChange = () => { };

  const PROFILE_FIELDS = [
    'nick', 'number', 'birth', 'nationality', 'team', 'season', 'contract',
    'height', 'weight', 'wingspan', 'hand', 'foot',
    'hist', 'plan', 'scores', 'item_notes', 'strengths', 'weaknesses', 'archived'
  ];

  /* junta o atleta do Load Control com o que este módulo guarda */
  function merged() {
    return cache.roster.map(p => {
      const pr = cache.profiles[p.id] || {};
      const g = {
        id: p.id,
        name: p.name,          /* do Load Control */
        photo: p.photo || null,/* do Load Control */
        nick: '', number: '', birth: null, nationality: '', team: '', season: '',
        contract: null, height: '', weight: '', wingspan: '', hand: '', foot: '',
        hist: {}, plan: {}, scores: {}, item_notes: {},
        strengths: [], weaknesses: [], archived: false
      };
      PROFILE_FIELDS.forEach(f => { if (pr[f] !== undefined && pr[f] !== null) g[f] = pr[f]; });
      /* o Realtime Database não guarda array vazio; normaliza de volta */
      if (!Array.isArray(g.strengths)) g.strengths = g.strengths ? Object.values(g.strengths) : [];
      if (!Array.isArray(g.weaknesses)) g.weaknesses = g.weaknesses ? Object.values(g.weaknesses) : [];
      return g;
    });
  }

  const assessId = (gk, date) => gk + '|' + date;

  function flatAssessments(gkId) {
    const out = [];
    Object.keys(cache.assessments).forEach(pid => {
      if (gkId && pid !== gkId) return;
      const byDate = cache.assessments[pid] || {};
      Object.keys(byDate).forEach(d => {
        const a = byDate[d] || {};
        out.push({ id: assessId(pid, d), goalkeeper_id: pid, date: a.date || d, scores: a.scores || {}, note: a.note || '' });
      });
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }

  function flatLogs(gkId) {
    const out = [];
    Object.keys(cache.logs).forEach(pid => {
      if (gkId && pid !== gkId) return;
      const byId = cache.logs[pid] || {};
      Object.keys(byId).forEach(id => {
        const l = byId[id] || {};
        out.push({
          id, goalkeeper_id: pid,
          date: l.date || '', cycle: l.cycle || '', focus: l.focus || '',
          progress: l.progress || '', limitation: l.limitation || '',
          next_step: l.next_step || '', status: l.status || 'good'
        });
      });
    });
    return out.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }

  const wait = v => Promise.resolve(v);

  const Adapter = {
    mode: 'flux',
    cache,

    /* ligado pelo boot: repassa cada mudança do PocketBase para a tela */
    bind(fn) { onChange = fn || (() => { }); },
    notify() { onChange(); },

    async init() { return true; },
    async currentUser() { return { id: FDB.uid, email: '' }; },
    async signIn() { throw new Error('O acesso é feito pelo hub.'); },
    async signOut() { throw new Error('Saia pelo hub.'); },

    /* ---------- elenco ---------- */
    async listGoalkeepers() { return wait(merged()); },

    async createGoalkeeper() {
      throw new Error('ROSTER_READONLY');
    },
    async deleteGoalkeeper() {
      throw new Error('ROSTER_READONLY');
    },

    async updateGoalkeeper(id, patch) {
      const clean = {};
      Object.keys(patch || {}).forEach(k => {
        if (PROFILE_FIELDS.indexOf(k) < 0) return;      /* nome e foto: do Load Control */
        let v = patch[k];
        if (v === undefined) v = null;
        if (Array.isArray(v)) v = v.filter(x => x !== undefined);
        clean[k] = v;
      });
      if (!Object.keys(clean).length) return merged().find(g => g.id === id);
      cache.profiles[id] = Object.assign({}, cache.profiles[id], clean);
      await FDB.saveProfile(id, clean);
      return merged().find(g => g.id === id);
    },

    /* ---------- avaliações ---------- */
    async listAssessments(gkId) { return wait(flatAssessments(gkId)); },

    async upsertAssessment(gkId, date, scores, note) {
      const obs = String(note || '');
      cache.assessments[gkId] = cache.assessments[gkId] || {};
      cache.assessments[gkId][date] = { date, scores, note: obs };
      await FDB.saveAssessment(gkId, date, scores, obs);
      return { id: assessId(gkId, date), goalkeeper_id: gkId, date, scores, note: obs };
    },

    async deleteAssessment(id) {
      const [gk, date] = String(id).split('|');
      if (cache.assessments[gk]) delete cache.assessments[gk][date];
      await FDB.deleteAssessment(gk, date);
      return true;
    },

    /* ---------- diário ---------- */
    async listLogs(gkId) { return wait(flatLogs(gkId)); },

    async createLog(gkId, obj) {
      const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const row = Object.assign({
        date: new Date().toISOString().slice(0, 10),
        cycle: '', focus: '', progress: '', limitation: '', next_step: '', status: 'good'
      }, obj || {});
      cache.logs[gkId] = cache.logs[gkId] || {};
      cache.logs[gkId][id] = row;
      await FDB.saveLog(gkId, id, row);
      return Object.assign({ id, goalkeeper_id: gkId }, row);
    },

    async updateLog(id, patch) {
      let gk = null;
      Object.keys(cache.logs).forEach(pid => { if (cache.logs[pid] && cache.logs[pid][id]) gk = pid; });
      if (!gk) throw new Error('Entrada não encontrada');
      cache.logs[gk][id] = Object.assign({}, cache.logs[gk][id], patch);
      await FDB.saveLog(gk, id, cache.logs[gk][id]);
      return Object.assign({ id, goalkeeper_id: gk }, cache.logs[gk][id]);
    },

    async deleteLog(id) {
      let gk = null;
      Object.keys(cache.logs).forEach(pid => { if (cache.logs[pid] && cache.logs[pid][id]) gk = pid; });
      if (!gk) return true;
      delete cache.logs[gk][id];
      await FDB.deleteLog(gk, id);
      return true;
    },

    /* ---------- critérios: biblioteca do treinador ---------- */
    async getModel() { return wait(cache.model); },
    async saveModel(model) {
      cache.model = model;
      await FDB.saveCriteria(model);
      return model;
    },

    /* ---------- identidade: vem do hub, não se edita aqui ---------- */
    async getSettings() { return wait(window.FLUX_BRAND || null); },
    async saveSettings() { throw new Error('BRAND_FROM_HUB'); },

    async exportAll() {
      return {
        goalkeepers: merged(),
        assessments: flatAssessments(null),
        log_entries: flatLogs(null),
        club_settings: window.FLUX_BRAND || null,
        assessment_model: cache.model
      };
    }
  };

  window.FluxAdapter = Adapter;
})();


/* ===== report-flux.js ===== */
/* =============================================================
   RELATÓRIOS EM PDF
   Gera arquivos de verdade (texto vetorial, não imagem) com
   pdf-lib. As bibliotecas são carregadas só quando você abre a
   tela de relatórios, para não pesar na abertura do sistema.
   ============================================================= */
(function () {
  'use strict';

  /* As bibliotecas vêm de CDN, como o Chart.js e o Three.js dos outros
     módulos. A fonte com cirílico é um subconjunto próprio e vai
     embutida — são 60 KB e não existe em CDN nenhum. */
  const CDN = {
    pdflib: 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
    fontkit: 'https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js',
    jszip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    /* mesma família da interface e dos demais relatórios do sistema */
    grotesk: {
      reg: 'https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.3.0/files/space-grotesk-latin-400-normal.woff',
      bold: 'https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.3.0/files/space-grotesk-latin-700-normal.woff'
    },
    mono: 'https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-400-normal.woff'
  };
  let MSG = { loadFail: 'Could not load the PDF engine.', fontFail: 'Report font failed to load.' };
  const A4 = { w: 595.28, h: 841.89 };
  const M = { l: 42, r: 42, t: 44, b: 46 };
  const CW = A4.w - M.l - M.r;

  /* ---------- carregamento sob demanda ---------- */
  let libsReady = null;
  function loadScript(src) {
    return new Promise((res, rej) => {
      if (document.querySelector(`script[data-lib="${src}"]`)) return res();
      const s = document.createElement('script');
      s.src = src; s.dataset.lib = src;
      s.onload = () => res();
      s.onerror = () => rej(new Error(MSG.loadFail));
      document.head.appendChild(s);
    });
  }
  async function ensureLibs(onProgress) {
    if (libsReady) return libsReady;
    libsReady = (async () => {
      if (onProgress) onProgress('libs');
      if (!window.PDFLib) await loadScript(CDN.pdflib);
      if (!window.fontkit) await loadScript(CDN.fontkit);
      if (!window.JSZip) await loadScript(CDN.jszip);
      if (onProgress) onProgress('fonts');
      const b64 = str => {
        const bin = atob(str);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };
      if (!window.ReportFonts) throw new Error(MSG.fontFail);
      const dejavu = { reg: b64(window.ReportFonts.regular), bold: b64(window.ReportFonts.bold) };
      /* Space Grotesk é a fonte do sistema — os relatórios saíam em DejaVu Sans,
         fora do padrão dos outros módulos. Ela não cobre cirílico, então o
         DejaVu continua embutido e entra só nos textos que precisam dele. */
      const baixa = async url => {
        const r = await fetch(url, { mode: 'cors' });
        if (!r.ok) throw new Error('font ' + r.status);
        return new Uint8Array(await r.arrayBuffer());
      };
      let grotesk = null, mono = null;
      try {
        const [gr, gb] = await Promise.all([baixa(CDN.grotesk.reg), baixa(CDN.grotesk.bold)]);
        grotesk = { reg: gr, bold: gb };
      } catch (e) {
        console.warn('[perfil] Space Grotesk indisponível, usando DejaVu:', e.message);
      }
      try { mono = await baixa(CDN.mono); }
      catch (e) { console.warn('[perfil] JetBrains Mono indisponível:', e.message); }
      return { reg: dejavu.reg, bold: dejavu.bold, grotesk: grotesk, mono: mono };
    })();
    return libsReady;
  }

  /* ---------- utilidades ---------- */
  const hex2rgb = h => {
    const s = String(h || '#000000').replace('#', '');
    return PDFLib.rgb(parseInt(s.slice(0, 2), 16) / 255,
      parseInt(s.slice(2, 4), 16) / 255,
      parseInt(s.slice(4, 6), 16) / 255);
  };
  function dataUrlToBytes(url) {
    const i = url.indexOf(',');
    const b64 = url.slice(i + 1);
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
    return out;
  }

  const INK = {
    primary: '#111111', secondary: '#3d3d3a', muted: '#77766f',
    grid: '#e4e3dd', axis: '#c3c2b7', line: '#dedcd5',
    good: '#0a7d0a', bad: '#c0392b', box: '#f6f6f3'
  };

  /* =============================================================
     DOCUMENTO — camada de layout
     ============================================================= */
  function Doc(pdf, fonts, opts) {
    const d = {
      pdf, page: null, y: 0, pageNo: 0,
      counter: opts.counter || null,
      f: fonts.reg, fb: fonts.bold,
      crest: opts.crest || null, club: opts.club || 'Semey',
      title: opts.title || '', subtitle: opts.subtitle || '',
      accent: opts.accent || '#2a78d6',
      footNote: opts.footNote || ''
    };

    const Y = v => A4.h - v;

    d.width = t => d.f.widthOfTextAtSize(t, 10);
    d.w = (t, size, bold) => (bold ? d.fb : d.f).widthOfTextAtSize(String(t), size);

    d.addPage = function () {
      d.page = pdf.addPage([A4.w, A4.h]);
      if (d.counter) { d.counter.n++; d.pageNo = d.counter.n; } else d.pageNo++;
      d.y = M.t;
      drawHeader();
      return d.page;
    };

    function drawHeader() {
      // marca d'água primeiro, para ficar atrás de tudo
      if (opts.watermark && d.crestImg) {
        try {
          const img = d.crestImg;
          const W = A4.w * 0.56;
          const sc = W / img.width;
          const H = img.height * sc;
          d.page.drawImage(img, {
            x: (A4.w - W) / 2, y: (A4.h - H) / 2,
            width: W, height: H, opacity: 0.028
          });
        } catch (e) { }
      }
      const top = M.t;
      if (d.crest) {
        try {
          const img = d.crestImg;
          if (img) {
            const s = 22 / Math.max(img.width, img.height);
            d.page.drawImage(img, {
              x: M.l, y: Y(top + 20), width: img.width * s, height: img.height * s
            });
          }
        } catch (e) { }
      }
      const tx = d.crest && d.crestImg ? M.l + 30 : M.l;
      d.page.drawText(d.club, { x: tx, y: Y(top + 9), size: 10.5, font: d.fb, color: hex2rgb(INK.primary) });
      if (d.title) {
        const w = d.w(d.title, 9, false);
        d.page.drawText(d.title, { x: A4.w - M.r - w, y: Y(top + 9), size: 9, font: d.f, color: hex2rgb(INK.muted) });
      }
      d.page.drawLine({
        start: { x: M.l, y: Y(top + 20) }, end: { x: A4.w - M.r, y: Y(top + 20) },
        thickness: 1.2, color: hex2rgb(d.accent)
      });
      d.y = top + 34;
    }

    d.footer = function (txt) {
      const y = Y(A4.h - M.b + 16);
      d.page.drawLine({
        start: { x: M.l, y: y + 12 }, end: { x: A4.w - M.r, y: y + 12 },
        thickness: .6, color: hex2rgb(INK.line)
      });
      if (txt) d.page.drawText(txt, { x: M.l, y, size: 7.5, font: d.f, color: hex2rgb(INK.muted) });
      const n = String(d.pageNo);
      d.page.drawText(n, { x: A4.w - M.r - d.w(n, 7.5, false), y, size: 7.5, font: d.f, color: hex2rgb(INK.muted) });
    };

    d.room = () => A4.h - M.b - 22 - d.y;
    d.ensure = function (h) {
      if (d.room() < h) { d.footer(d.footNote); d.addPage(); return true; }
      return false;
    };
    d.space = n => { d.y += n; };

    /* --- texto --- */
    d.wrap = function (txt, size, bold, maxW) {
      const words = String(txt == null ? '' : txt).split(/\s+/).filter(Boolean);
      const lines = []; let cur = '';
      const font = bold ? d.fb : d.f;
      words.forEach(w => {
        const test = cur ? cur + ' ' + w : w;
        if (font.widthOfTextAtSize(test, size) <= maxW) cur = test;
        else {
          if (cur) lines.push(cur);
          // palavra maior que a linha: corta
          let piece = w;
          while (font.widthOfTextAtSize(piece, size) > maxW && piece.length > 1) {
            let cut = piece.length - 1;
            while (cut > 1 && font.widthOfTextAtSize(piece.slice(0, cut), size) > maxW) cut--;
            lines.push(piece.slice(0, cut));
            piece = piece.slice(cut);
          }
          cur = piece;
        }
      });
      if (cur) lines.push(cur);
      return lines.length ? lines : [''];
    };

    d.text = function (txt, o) {
      o = o || {};
      const size = o.size || 9.5, bold = !!o.bold;
      const color = hex2rgb(o.color || INK.secondary);
      const maxW = o.maxW || CW;
      const x = o.x != null ? o.x : M.l;
      const lh = o.lh || size * 1.42;
      const src = String(txt == null ? '' : txt);
      const paras = src.split(/\n/);
      paras.forEach((p, pi) => {
        const lines = p.trim() ? d.wrap(p, size, bold, maxW) : [''];
        lines.forEach(ln => {
          if (!o.noBreak) d.ensure(lh + 2);
          let px = x;
          if (o.align === 'right') px = x + maxW - d.w(ln, size, bold);
          if (o.align === 'center') px = x + (maxW - d.w(ln, size, bold)) / 2;
          d.page.drawText(ln, { x: px, y: Y(d.y + size), size, font: bold ? d.fb : d.f, color });
          d.y += lh;
        });
        if (pi < paras.length - 1) d.y += lh * .35;
      });
    };

    d.h1 = function (txt) {
      d.ensure(30);
      d.space(4);
      d.text(txt, { size: 15, bold: true, color: INK.primary, lh: 20 });
      d.space(5);
    };
    d.h2 = function (txt) {
      d.ensure(26);
      d.space(9);
      d.text(String(txt).toUpperCase(), { size: 8.2, bold: true, color: INK.muted, lh: 12 });
      d.page.drawLine({
        start: { x: M.l, y: Y(d.y + 1) }, end: { x: A4.w - M.r, y: Y(d.y + 1) },
        thickness: .6, color: hex2rgb(INK.line)
      });
      d.space(9);
    };

    /* --- blocos --- */
    d.kv = function (rows, cols) {
      cols = cols || 3;
      const colW = CW / cols;
      const rowH = 27;
      for (let i = 0; i < rows.length; i += cols) {
        d.ensure(rowH + 2);
        const slice = rows.slice(i, i + cols);
        slice.forEach((r, k) => {
          const x = M.l + k * colW;
          d.page.drawText(String(r[0]), { x, y: Y(d.y + 7.4), size: 7.4, font: d.f, color: hex2rgb(INK.muted) });
          const val = String(r[1] == null || r[1] === '' ? '—' : r[1]);
          const lines = d.wrap(val, 10, true, colW - 10);
          d.page.drawText(lines[0], { x, y: Y(d.y + 21), size: 10, font: d.fb, color: hex2rgb(INK.primary) });
        });
        d.y += rowH;
      }
    };

    /* caixa de destaque com nota grande */
    d.scoreBoxes = function (items) {
      const gap = 8;
      const bw = (CW - gap * (items.length - 1)) / items.length;
      const bh = 54;
      d.ensure(bh + 6);
      items.forEach((it, i) => {
        const x = M.l + i * (bw + gap);
        d.page.drawRectangle({
          x, y: Y(d.y + bh), width: bw, height: bh,
          color: hex2rgb(INK.box), borderColor: hex2rgb(INK.line), borderWidth: .6
        });
        d.page.drawRectangle({ x, y: Y(d.y + bh), width: 2.6, height: bh, color: hex2rgb(it.color || d.accent) });
        d.page.drawText(String(it.value), {
          x: x + 10, y: Y(d.y + 26), size: 19, font: d.fb, color: hex2rgb(INK.primary)
        });
        if (it.delta) {
          const dc = it.delta > 0 ? INK.good : INK.bad;
          const dt = (it.delta > 0 ? '▲ +' : '▼ ') + Math.abs(it.delta).toFixed(1);
          d.page.drawText(dt, { x: x + 10 + d.w(String(it.value), 19, true) + 6, y: Y(d.y + 24), size: 8, font: d.fb, color: hex2rgb(dc) });
        }
        /* o rotulo cabia so na primeira linha e "Componentes Taticos" virava
           "Componentes". Agora encolhe a fonte para tentar caber inteiro e,
           se ainda nao couber, usa duas linhas. */
        let ls = 7.2, lab = d.wrap(it.label, ls, false, bw - 14);
        while (lab.length > 1 && ls > 5.6) { ls -= 0.4; lab = d.wrap(it.label, ls, false, bw - 14); }
        lab = lab.slice(0, 2);
        if (lab.length === 1) {
          d.page.drawText(lab[0], { x: x + 10, y: Y(d.y + 43), size: ls, font: d.f, color: hex2rgb(INK.muted) });
        } else {
          d.page.drawText(lab[0], { x: x + 10, y: Y(d.y + 38), size: ls, font: d.f, color: hex2rgb(INK.muted) });
          d.page.drawText(lab[1], { x: x + 10, y: Y(d.y + 47), size: ls, font: d.f, color: hex2rgb(INK.muted) });
        }
      });
      d.y += bh + 6;
    };

    /* barras horizontais 0–10 */
    d.bars = function (rows, opts2) {
      opts2 = opts2 || {};
      const vMax = opts2.max || 10;
      const labW = opts2.labelWidth || 190;
      const valW = 46;
      const barW = CW - labW - valW;
      const rowH = 15;
      rows.forEach(r => {
        d.ensure(rowH + 1);
        const lab = d.wrap(r.label, 8.4, false, labW - 8)[0];
        d.page.drawText(lab, { x: M.l, y: Y(d.y + 10), size: 8.4, font: d.f, color: hex2rgb(INK.primary) });
        const bx = M.l + labW, by = Y(d.y + 11.5), bh = 7;
        d.page.drawRectangle({ x: bx, y: by, width: barW, height: bh, color: hex2rgb(INK.grid) });
        const v = +r.value || 0;
        if (v > 0) {
          d.page.drawRectangle({
            x: bx, y: by, width: Math.max(2, (v / vMax) * barW), height: bh,
            color: hex2rgb(r.color || d.accent)
          });
        }
        const vt = v ? (v % 1 ? v.toFixed(1) : String(v)) : '–';
        d.page.drawText(vt, { x: bx + barW + 8, y: Y(d.y + 10), size: 8.6, font: d.fb, color: hex2rgb(INK.primary) });
        if (r.delta) {
          const dc = r.delta > 0 ? INK.good : INK.bad;
          const dt = (r.delta > 0 ? '▲+' : '▼') + Math.abs(r.delta).toFixed(r.delta % 1 ? 1 : 0);
          d.page.drawText(dt, { x: bx + barW + 8 + 20, y: Y(d.y + 10), size: 7.4, font: d.fb, color: hex2rgb(dc) });
        }
        d.y += rowH;
      });
    };

    /* tabela simples */
    d.table = function (head, rows, widths, opts2) {
      opts2 = opts2 || {};
      // se vierem menos larguras que colunas, o resto divide o espaço restante
      const w2 = (widths || []).slice(0, head.length);
      while (w2.length < head.length) w2.push(w2.length ? w2[w2.length - 1] : 1);
      const total = w2.reduce((a, b) => a + b, 0) || 1;
      const cols = w2.map(w => (w / total) * CW);
      const rowH = opts2.rowH || 17;
      const drawHead = () => {
        d.ensure(rowH + 4);
        let x = M.l;
        head.forEach((h, i) => {
          // corta o título ao espaço real da coluna, para nunca invadir a vizinha
          let txt = String(h);
          const avail = cols[i] - (i === 0 ? 2 : 6);
          if (d.w(txt, 7.4, true) > avail) {
            while (txt.length > 1 && d.w(txt + '…', 7.4, true) > avail) txt = txt.slice(0, -1);
            txt = txt + '…';
          }
          const px = i === 0 ? x : x + cols[i] - d.w(txt, 7.4, true);
          d.page.drawText(txt, { x: px, y: Y(d.y + 9), size: 7.4, font: d.fb, color: hex2rgb(INK.muted) });
          x += cols[i];
        });
        d.y += 12;
        d.page.drawLine({
          start: { x: M.l, y: Y(d.y) }, end: { x: A4.w - M.r, y: Y(d.y) },
          thickness: .7, color: hex2rgb(INK.axis)
        });
        d.y += 5;
      };
      drawHead();
      rows.forEach(r => {
        if (d.room() < rowH + 2) { d.footer(d.footNote); d.addPage(); drawHead(); }
        if (r.group) {
          d.space(5);
          d.page.drawText(String(r.group).toUpperCase(), {
            x: M.l, y: Y(d.y + 8), size: 7, font: d.fb, color: hex2rgb(INK.muted)
          });
          d.y += 13;
          return;
        }
        let x = M.l;
        r.cells.forEach((c, i) => {
          const val = c && typeof c === 'object' ? c.t : c;
          const col = c && typeof c === 'object' ? c.c : null;
          const bold = !!(c && typeof c === 'object' && c.b);
          const txt = String(val == null || val === '' ? '—' : val);
          const size = 8.4;
          let px = x;
          if (i > 0) px = x + cols[i] - d.w(txt, size, bold);
          if (col && i === 0) {
            d.page.drawRectangle({ x, y: Y(d.y + 9), width: 6, height: 6, color: hex2rgb(col) });
            px = x + 11;
          }
          const clip = d.wrap(txt, size, bold, i === 0 ? cols[i] - (col ? 14 : 2) : cols[i])[0];
          if (i > 0) px = x + cols[i] - d.w(clip, size, bold);
          d.page.drawText(clip, {
            x: px, y: Y(d.y + 10), size, font: bold ? d.fb : d.f,
            color: hex2rgb(c && typeof c === 'object' && c.ink ? c.ink : INK.primary)
          });
          x += cols[i];
        });
        d.y += rowH;
        d.page.drawLine({
          start: { x: M.l, y: Y(d.y - 4) }, end: { x: A4.w - M.r, y: Y(d.y - 4) },
          thickness: .4, color: hex2rgb(INK.line)
        });
      });
      d.space(4);
    };

    /* gráfico de linhas 0–10 no tempo */
    d.lineChart = function (series, opts2) {
      opts2 = opts2 || {};
      const H = opts2.height || 150;
      let padR = 34;
      if (opts2.nameLabels) {
        padR = 0;
        series.forEach(s2 => {
          const last = s2.points[s2.points.length - 1];
          if (!last) return;
          const txt = `${s2.short || s2.label} ${last.y.toFixed(1)}`;
          padR = Math.max(padR, d.w(txt, 7.6, true) + 12);
        });
        padR = Math.min(Math.max(padR, 34), CW * 0.42);
      }
      const padL = 26;
      d.ensure(H + 26);
      const x0 = M.l + padL, x1 = A4.w - M.r - padR;
      const yTop = d.y, yBot = d.y + H;
      const all = [];
      series.forEach(s => s.points.forEach(p => all.push(+new Date(p.t))));
      if (!all.length) { d.y += 10; return; }
      let t0 = Math.min.apply(null, all), t1 = Math.max.apply(null, all);
      if (t0 === t1) { t0 -= 864e5; t1 += 864e5; }
      const X = t => x0 + ((+new Date(t) - t0) / (t1 - t0)) * (x1 - x0);
      const vMax = opts2.yMax || 10;
      const YY = v => yBot - (Math.max(0, Math.min(vMax, v)) / vMax) * (yBot - yTop);

      (opts2.ticks || [0, 2, 4, 6, 8, 10]).filter(v => v <= vMax).forEach(v => {
        const yy = YY(v);
        d.page.drawLine({ start: { x: x0, y: Y(yy) }, end: { x: x1, y: Y(yy) }, thickness: .5, color: hex2rgb(INK.grid) });
        d.page.drawText(String(v), { x: x0 - 6 - d.w(String(v), 7, false), y: Y(yy + 2.4), size: 7, font: d.f, color: hex2rgb(INK.muted) });
      });

      const uniq = Array.from(new Set(all)).sort((a, b) => a - b);
      let lastPx = X(uniq[uniq.length - 1]);
      const keep = new Set([uniq[uniq.length - 1]]);
      for (let i = uniq.length - 2; i >= 0; i--) {
        if (lastPx - X(uniq[i]) >= 62) { keep.add(uniq[i]); lastPx = X(uniq[i]); }
      }
      uniq.forEach(t => {
        if (!keep.has(t)) return;
        const lab = opts2.formatX ? opts2.formatX(new Date(t)) : new Date(t).toISOString().slice(0, 10);
        const w = d.w(lab, 7, false);
        let px = X(t) - w / 2;
        px = Math.max(x0 - 6, Math.min(x1 - w, px));
        d.page.drawText(lab, { x: px, y: Y(yBot + 11), size: 7, font: d.f, color: hex2rgb(INK.muted) });
      });

      // rótulos finais sem sobreposição
      const ends = series.map((s, i) => {
        const last = s.points[s.points.length - 1];
        return last ? { i, v: last.y, yy: YY(last.y), x: X(last.t), s } : null;
      }).filter(Boolean).sort((a, b) => a.yy - b.yy);
      let prev = -1e9;
      ends.forEach(e => { let ly = e.yy + 2.6; if (ly - prev < 9.5) ly = prev + 9.5; e.ly = ly; prev = ly; });

      series.forEach((s, i) => {
        if (!s.points.length) return;
        const col = hex2rgb(s.color || '#2a78d6');
        const pts = s.points.map(p => ({ x: X(p.t), y: YY(p.y) }));
        for (let k = 1; k < pts.length; k++) {
          d.page.drawLine({
            start: { x: pts[k - 1].x, y: Y(pts[k - 1].y) }, end: { x: pts[k].x, y: Y(pts[k].y) },
            thickness: s.dashed ? 1 : 1.5, color: col,
            dashArray: s.dashed ? [3, 2.5] : undefined
          });
        }
        pts.forEach(p => d.page.drawCircle({ x: p.x, y: Y(p.y), size: 2.2, color: col }));
        const e = ends.find(z => z.i === i);
        if (e) {
          const txt = opts2.nameLabels ? `${s.short || s.label} ${e.v.toFixed(1)}` : e.v.toFixed(1);
          d.page.drawText(txt, { x: e.x + 5, y: Y(e.ly + 2.4), size: 7.6, font: d.fb, color: col });
        }
      });
      d.y = yBot + 18;
    };

    d.legend = function (items) {
      d.ensure(14);
      let x = M.l;
      items.forEach(it => {
        const w = d.w(it.label, 7.6, false);
        if (x + w + 16 > A4.w - M.r) { d.y += 11; x = M.l; }
        d.page.drawRectangle({ x, y: Y(d.y + 7.5), width: 6, height: 6, color: hex2rgb(it.color) });
        d.page.drawText(it.label, { x: x + 10, y: Y(d.y + 7.5), size: 7.6, font: d.f, color: hex2rgb(INK.secondary) });
        x += w + 22;
      });
      d.y += 14;
    };

    d.photo = function (img, x, w, h) {
      if (!img) {
        d.page.drawRectangle({
          x, y: Y(d.y + h), width: w, height: h,
          color: hex2rgb(INK.box), borderColor: hex2rgb(INK.line), borderWidth: .6
        });
        return;
      }
      const sc = Math.max(w / img.width, h / img.height);
      const iw = img.width * sc, ih = img.height * sc;
      d.page.drawRectangle({ x, y: Y(d.y + h), width: w, height: h, color: hex2rgb(INK.box) });
      d.page.drawImage(img, { x: x - (iw - w) / 2, y: Y(d.y + h) - (ih - h) / 2, width: iw, height: ih });
      d.page.drawRectangle({
        x, y: Y(d.y + h), width: w, height: h,
        borderColor: hex2rgb(INK.line), borderWidth: .6, opacity: 0
      });
    };

    d.note = function (txt) {
      d.ensure(24);
      const lines = d.wrap(txt, 8, false, CW - 20);
      const h = lines.length * 11 + 12;
      d.page.drawRectangle({
        x: M.l, y: Y(d.y + h), width: CW, height: h,
        color: hex2rgb(INK.box), borderColor: hex2rgb(INK.line), borderWidth: .6
      });
      let yy = d.y + 8;
      lines.forEach(ln => {
        d.page.drawText(ln, { x: M.l + 10, y: Y(yy + 8), size: 8, font: d.f, color: hex2rgb(INK.secondary) });
        yy += 11;
      });
      d.y += h + 6;
    };

    return d;
  }

  /* =============================================================
     MONTAGEM DOS RELATÓRIOS
     ============================================================= */
  function ctx(o) {
    const lang = o.lang || 'pt';
    const T2 = o.T;
    const model = o.model;
    const t = k => (T2[k] && T2[k][lang]) || k;
    const LOC = { pt: 'pt-BR', en: 'en-GB', ru: 'ru-RU' };
    const fmtDate = dt => {
      if (!dt) return '—';
      const x = new Date(dt); if (isNaN(x)) return String(dt);
      return x.toLocaleDateString(LOC[lang], { day: '2-digit', month: 'short', year: 'numeric' });
    };
    const fmtShort = dt => new Date(dt).toLocaleDateString(LOC[lang], { day: '2-digit', month: 'short' });

    const AXES = ModelKit.axes(model).map(a => a.id);
    const AX = k => ModelKit.axisById(model, k) || { label: {}, short: {}, micro: {}, items: [] };
    const axLabel = (k, kind) => (AX(k)[kind || 'label'] || {})[lang] || '';
    const axColor = k => ModelKit.colorOf(model, k);
    const items = k => AX(k).items;
    const allItems = ModelKit.allItems(model);
    const axisAvg = (k, sc) => ModelKit.axisAvg(model, k, sc);
    const globalAvg = sc => ModelKit.globalAvg(model, sc);
    const sMax = ModelKit.scaleMax(model);
    const sMin = ModelKit.scaleMin(model);
    const ticks = ModelKit.ticks(model);
    const itemLabel = it => (it && it[lang]) || (it && it.pt) || '';

    const n1 = v => v ? v.toFixed(1) : '—';
    const nameOf = g => (g.name || '').trim() || t('emptyName');
    const shortOf = g => {
      const f = nameOf(g).trim().split(/\s+/)[0] || '';
      return f.length <= 12 ? f : f.slice(0, 11) + '…';
    };
    const age = b => {
      if (!b) return null;
      const dt = new Date(b); if (isNaN(dt)) return null;
      const n = new Date(); let a = n.getFullYear() - dt.getFullYear();
      const m = n.getMonth() - dt.getMonth();
      if (m < 0 || (m === 0 && n.getDate() < dt.getDate())) a--;
      return a >= 0 && a < 120 ? a : null;
    };
    return {
      lang, t, T2, model, AXES, AX, axLabel, axColor, items, allItems, itemLabel,
      axisAvg, globalAvg, sMax, sMin, ticks, n1, nameOf, shortOf, age, fmtDate, fmtShort
    };
  }

  function inRange(dateStr, range) {
    if (!range) return true;
    if (range.from && dateStr < range.from) return false;
    if (range.to && dateStr > range.to) return false;
    return true;
  }

  function periodLabel(C, range) {
    if (!range || (!range.from && !range.to)) return C.t('rpFullSeason');
    return `${range.from ? C.fmtDate(range.from) : '…'} — ${range.to ? C.fmtDate(range.to) : '…'}`;
  }


  /* =============================================================
     CAPA INSTITUCIONAL
     Faixa na cor do clube com o escudo, e a parte de baixo com o
     título do relatório, o atleta, o período e a assinatura.
     ============================================================= */
  /* ============================================================
     CAPA — réplica exata da capa do relatório de Minutos.
     Os valores vêm do CSS daquele módulo convertidos de px para
     pontos (1px CSS = 0.75pt), então o resultado é o mesmo desenho:

       .cover        padding 52px 52px 48px      → 39 / 39 / 36
       .cover-tag    9px, 700, tracking .22em    → 6.75, mb 18px → 13.5
       .cover-badge  56px, radius 10px, bg .12   → 42, r 7.5, borda .18
       .cover-title  44px, 700, ls -2px, lh 1.05 → 33, ls -1.5, lh 34.65
       .cover-sub    16px, branco .60, mb 36px   → 12, mb 27
       label         9px mono, .12em, .38, mb 8  → 6.75, mb 6
       .game-tag     11px 600, pad 4/10, r 4px   → 8.25, 3/7.5, r 3
       .meta-label   9px mono, .1em, .38         → 6.75
       .meta-value   13px, 600, .88, gap 3px     → 9.75, gap 2.25
       .cover-footer mt 40, pt 14, 9px, .08em    → 30, 10.5, 6.75
     ============================================================ */
  async function drawCover(pdf, fonts, o, info) {
    const C = ctx(o);
    const page = pdf.addPage([A4.w, A4.h]);
    const Y = v => A4.h - v;

    const PADX = 39, PADT = 39, PADB = 36;
    const W = A4.w - PADX * 2;

    const band = (o.clubColor && ColorKit.isHex(o.clubColor) && !ColorKit.isNeutral(o.clubColor))
      ? ColorKit.norm(o.clubColor)
      : (o.accent || '#2a78d6');
    /* o Minutes usa branco puro sobre a cor do clube */
    const onBand = ColorKit.contrast(band, '#ffffff') >= 2.0 ? '#ffffff' : '#111111';
    const ink = hex2rgb(onBand);
    const mono = fonts.mono || fonts.reg;

    page.drawRectangle({ x: 0, y: 0, width: A4.w, height: A4.h, color: hex2rgb(band) });

    /* letter-spacing de verdade: cada caractere é posicionado somando o
       avanço da fonte mais o tracking, como o navegador faz */
    const largTracked = (txt, f, size, em) => {
      const t2 = String(txt || '');
      let w = 0;
      for (const ch of t2) w += f.widthOfTextAtSize(ch, size) + size * em;
      return w - (t2.length ? size * em : 0);
    };
    const drawTracked = (txt, x, yTop, f, size, em, opacity) => {
      const t2 = String(txt || '');
      let cx = x;
      for (const ch of t2) {
        page.drawText(ch, { x: cx, y: Y(yTop + size), size: size, font: f, color: ink, opacity: opacity });
        cx += f.widthOfTextAtSize(ch, size) + size * em;
      }
    };
    const plain = (txt, x, yTop, f, size, opacity) => {
      page.drawText(String(txt == null ? '' : txt), {
        x: x, y: Y(yTop + size), size: size, font: f, color: ink,
        opacity: opacity == null ? 1 : opacity
      });
    };

    let y = PADT;

    /* .cover-tag ─ FLUXGK */
    drawTracked('FLUXGK', PADX, y, mono, 6.75, 0.22, 0.45);
    y += 6.75 + 13.5;

    /* .cover-badge ─ 42pt, fundo branco a 12%, escudo ocupando a caixa toda
       (no CSS a imagem é 56x56 com object-fit:contain, sem folga interna) */
    const crestImg = o.crest ? await embedImg(pdf, o.crest) : null;
    const B = 42;
    page.drawRectangle({
      x: PADX, y: Y(y + B), width: B, height: B,
      color: ink, opacity: .12, borderColor: ink, borderOpacity: .18, borderWidth: .75
    });
    if (crestImg) {
      const sc = Math.min(B / crestImg.width, B / crestImg.height);
      const iw = crestImg.width * sc, ih = crestImg.height * sc;
      page.drawImage(crestImg, {
        x: PADX + (B - iw) / 2, y: Y(y + B) + (B - ih) / 2, width: iw, height: ih
      });
    } else {
      const ini = String(o.clubName || 'GK').slice(0, 2).toUpperCase();
      const w = fonts.bold.widthOfTextAtSize(ini, 13.5);
      page.drawText(ini, {
        x: PADX + (B - w) / 2, y: Y(y + B / 2 + 4.8), size: 13.5, font: fonts.bold, color: ink
      });
    }
    y += B + 21;

    /* .cover-title ─ 33pt bold, entrelinha 34.65, quebra igual à do navegador */
    const TS = 33, TLH = 34.65;
    const palavras = String(info.title || '').split(/\s+/).filter(Boolean);
    const linhas = []; let cur = '';
    palavras.forEach(w => {
      const teste = cur ? cur + ' ' + w : w;
      if (fonts.bold.widthOfTextAtSize(teste, TS) <= W) cur = teste;
      else { if (cur) linhas.push(cur); cur = w; }
    });
    if (cur) linhas.push(cur);
    linhas.slice(0, 3).forEach((ln, i) => {
      let sz = TS;
      while (fonts.bold.widthOfTextAtSize(ln, sz) > W && sz > 16) sz -= 0.5;
      page.drawText(ln, { x: PADX, y: Y(y + sz), size: sz, font: fonts.bold, color: ink });
      y += TLH;
    });
    y += 7.5;

    /* .cover-sub ─ nome do clube */
    plain(o.clubName || '', PADX, y, fonts.reg, 12, .60);
    y += 12 + 27;

    /* .cover-games ─ rótulo + etiquetas */
    const tags = String(info.subtitle || '').split(/\s+·\s+/).map(x => x.trim()).filter(Boolean);
    drawTracked(String(info.kind || '').toUpperCase(), PADX, y, mono, 6.75, 0.12, 0.38);
    y += 6.75 + 6;
    if (tags.length) {
      let tx = PADX;
      const TH = 15.75;              /* 4px+13px+4px do CSS = 21px → 15.75pt */
      tags.forEach(tg => {
        const tw = fonts.bold.widthOfTextAtSize(tg, 8.25) + 15;
        if (tx + tw > PADX + W) { tx = PADX; y += TH + 4.5; }
        page.drawRectangle({
          x: tx, y: Y(y + TH), width: tw, height: TH,
          color: ink, opacity: .12, borderColor: ink, borderOpacity: .18, borderWidth: .75
        });
        page.drawText(tg, {
          x: tx + 7.5, y: Y(y + TH - 5), size: 8.25, font: fonts.bold, color: ink, opacity: .85
        });
        tx += tw + 4.5;
      });
      y += TH;
    }
    y += 27;

    /* .cover-meta ─ colunas com gap de 27pt */
    const meta = [];
    if (info.season) meta.push([C.t('season'), info.season]);
    meta.push([C.t('rpPeriodLabel'), info.period]);
    if (info.count) meta.push([C.t('rpGks'), String(info.count)]);
    meta.push([C.t('rpGenerated'), C.fmtDate(o.today)]);
    if (o.respName) meta.push([o.respRole || C.t('respName'), o.respName]);

    let mx = PADX;
    meta.forEach(r => {
      const rot = String(r[0]).toUpperCase(), val = String(r[1] || '');
      const larg = Math.max(
        largTracked(rot, mono, 6.75, 0.1),
        fonts.bold.widthOfTextAtSize(val, 9.75)
      );
      if (mx + larg > PADX + W) { mx = PADX; y += 6.75 + 2.25 + 9.75 + 12; }
      drawTracked(rot, mx, y, mono, 6.75, 0.1, 0.38);
      plain(val, mx, y + 6.75 + 2.25, fonts.bold, 9.75, .88);
      mx += larg + 27;
    });

    /* .cover-footer ─ colado no pé, como o flex:1 do .cover-top faz */
    const fSize = 6.75;
    const baseFoot = A4.h - PADB - fSize;
    page.drawLine({
      start: { x: PADX, y: Y(baseFoot - 10.5) }, end: { x: A4.w - PADX, y: Y(baseFoot - 10.5) },
      thickness: .75, color: ink, opacity: .14
    });
    const esq = ('FLUXGK · ' + (o.clubName || '')).toUpperCase();
    const dir = String(C.t('rpMethod')).toUpperCase();
    drawTracked(esq, PADX, baseFoot, mono, fSize, 0.08, 0.32);
    drawTracked(dir, A4.w - PADX - largTracked(dir, mono, fSize, 0.08), baseFoot, mono, fSize, 0.08, 0.32);

    return page;
  }

  /* --------------------------------------------------
     1. Individual de desenvolvimento
     -------------------------------------------------- */
  async function buildIndividual(pdf, fonts, o, gk) {
    const C = ctx(o);
    const snaps = o.assessments.filter(a => a.goalkeeper_id === gk.id && inRange(a.date, o.range))
      .sort((a, b) => a.date.localeCompare(b.date));
    const logs = o.logs.filter(l => l.goalkeeper_id === gk.id && inRange(l.date, o.range))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const first = snaps.length ? snaps[0].scores : null;
    const cur = gk.scores || {};

    const d = Doc(pdf, fonts, {
      counter: o.counter, watermark: o.watermark, crest: o.crest, club: o.clubName, accent: o.accent,
      title: `${C.t('rpIndividual')} · ${periodLabel(C, o.range)}`,
      footNote: `${C.nameOf(gk)} · ${o.clubName} · ${C.t('rpGenerated')} ${C.fmtDate(o.today)}`
    });
    if (o.crestImg) d.crestImg = o.crestImg;
    /* blocos escolhidos na aba Relatórios; sem escolha, sai tudo */
    const S = Object.assign({ ident: 1, resumo: 1, evol: 1, comp: 1, fw: 1, qual: 1, plano: 1, diario: 1 }, o.secs || {});
    d.addPage();

    // identificação
    const photo = gk.photo ? await embedImg(pdf, gk.photo) : null;
    const pw = 82, ph = 100;
    const topY = d.y;
    d.photo(photo, M.l, pw, ph);
    const bx = M.l + pw + 16;
    d.page.drawText(C.nameOf(gk), { x: bx, y: (A4.h - (d.y + 16)), size: 17, font: d.fb, color: hex2rgb(INK.primary) });
    const sub = [gk.number ? '#' + gk.number : '', gk.team, gk.season].filter(Boolean).join('  ·  ');
    d.page.drawText(sub, { x: bx, y: (A4.h - (d.y + 30)), size: 8.6, font: d.f, color: hex2rgb(INK.muted) });
    d.y += 40;

    const yrs = C.age(gk.birth);
    const savedY = d.y;
    d.y = savedY;
    /* campo vazio nao entra no PDF: antes saia uma coluna de tracinhos */
    const kvRows = [
      [C.t('birth'), gk.birth ? C.fmtDate(gk.birth) + (yrs != null ? `  (${yrs})` : '') : ''],
      [C.t('nationality'), gk.nationality],
      [C.t('height'), gk.height ? gk.height + ' cm' : ''],
      [C.t('weight'), gk.weight ? gk.weight + ' kg' : ''],
      [C.t('wingspan'), gk.wingspan ? gk.wingspan + ' cm' : ''],
      [C.t('foot'), gk.foot ? C.t(gk.foot === 'R' ? 'footR' : gk.foot === 'L' ? 'footL' : 'footB') : ''],
      [C.t('hand'), gk.hand ? C.t(gk.hand === 'R' ? 'handR' : gk.hand === 'L' ? 'handL' : 'handB') : ''],
      [C.t('team'), gk.team],
      [C.t('contract'), gk.contract ? C.fmtDate(gk.contract) : '']
    ].filter(r => S.ident && String(r[1] || '').trim());
    // duas colunas ao lado da foto
    const colW = (CW - pw - 16) / 2;
    kvRows.forEach((r, i) => {
      const cx = bx + (i % 2) * colW;
      const cy = d.y + Math.floor(i / 2) * 22;
      d.page.drawText(String(r[0]), { x: cx, y: A4.h - (cy + 7), size: 7, font: d.f, color: hex2rgb(INK.muted) });
      d.page.drawText(String(r[1]), { x: cx, y: A4.h - (cy + 18), size: 9, font: d.fb, color: hex2rgb(INK.primary) });
    });
    d.y = Math.max(topY + ph, d.y + Math.ceil(kvRows.length / 2) * 22) + 12;

    // comentario qualitativo do treinador (o mais recente do periodo)
    const comQual = S.qual ? snaps.filter(sn => String(sn.note || '').trim()) : [];
    if (comQual.length) {
      const ult = comQual[comQual.length - 1];
      d.ensure(70);
      d.h2(C.t('qualTitle') + '  ·  ' + C.fmtDate(ult.date));
      d.text(ult.note, { size: 9, color: INK.secondary });
    }

    // pontos fortes e a desenvolver
    const st = S.fw ? (gk.strengths || []).filter(x => String(x || '').trim()) : [];
    const wk = S.fw ? (gk.weaknesses || []).filter(x => String(x || '').trim()) : [];
    if (st.length || wk.length) {
      d.ensure(90);
      d.h2(C.t('strengths') + '  ·  ' + C.t('weaknesses'));
      const half = CW / 2 - 10;
      const yStart = d.y;
      let yA = yStart;
      st.forEach(s => {
        const lines = d.wrap('•  ' + s, 8.6, false, half);
        lines.forEach(ln => {
          d.page.drawText(ln, { x: M.l, y: A4.h - (yA + 8.6), size: 8.6, font: d.f, color: hex2rgb(INK.secondary) });
          yA += 12.4;
        });
        yA += 2;
      });
      let yB = yStart;
      wk.forEach(s => {
        const lines = d.wrap('•  ' + s, 8.6, false, half);
        lines.forEach(ln => {
          d.page.drawText(ln, { x: M.l + CW / 2 + 10, y: A4.h - (yB + 8.6), size: 8.6, font: d.f, color: hex2rgb(INK.secondary) });

        });
        yB += 2;
      });

    }));

      label: C.t('avgGlobal'), value: C.n1(C.globalAvg(cur)), color: INK.primary,
      delta: first ? +(C.globalAvg(cur) - C.globalAvg(first)).toFixed(1) : 0
    });

    if (first) d.text(C.t('rpDeltaNote') + ' ' + C.fmtDate(snaps[0].date), { size: 7.6, color: INK.muted });
    }

    // evolução
    if (S.evol && snaps.length >= 2) {
      d.h2(C.t('rpProgress'));
      d.legend(C.AXES.map(k => ({ label: C.axLabel(k, 'short'), color: o.seriesColors[C.axColor(k) - 1] })));
      d.lineChart(C.AXES.map(k => ({
        label: C.axLabel(k, 'short'), color: o.seriesColors[C.axColor(k) - 1],
        points: snaps.map(s => ({ t: s.date, y: C.axisAvg(k, s.scores) }))
      })), { height: 140, formatX: C.fmtShort, yMax: C.sMax, ticks: C.ticks });
    } else if (S.evol) {
      d.h2(C.t('rpProgress'));
      d.note(C.t('rpNoProgress'));
    }

    // perfil por competência
    if (S.comp) {
    d.footer(d.footNote); d.addPage();
    d.h1(C.t('rpTechProfile'));
    C.AXES.forEach(k => {
      d.h2(C.axLabel(k));
      d.bars(C.items(k).map(i => ({
        label: C.itemLabel(i),
        value: +cur[i.id] || 0,
        color: o.seriesColors[C.axColor(k) - 1],
        delta: first && first[i.id] && cur[i.id] ? (+cur[i.id] - +first[i.id]) : 0
      })), { labelWidth: 210, max: C.sMax });
    });
    }

    // plano de desenvolvimento
    const p = gk.plan || {};
    const hasPlan = S.plano && ['macroGoal', 'targetBehaviour', 'cTask', 'cEnv', 'cInd', 'affordances', 'indicators']
      .some(k => String(p[k] || '').trim());
    if (hasPlan) {
      d.footer(d.footNote); d.addPage();
      d.h1(C.T2.tabs.plano[C.lang]);

        ['macroGoal', p.macroGoal], ['targetBehaviour', p.targetBehaviour]
