        if (!String(v || '').trim()) return;
        d.h2(C.t(k));
        d.text(v, { size: 9.4 });
      });
      const cons = [['cTask', p.cTask], ['cEnv', p.cEnv], ['cInd', p.cInd]].filter(([, v]) => String(v || '').trim());
      if (cons.length) {
        d.h2(C.t('constraints'));
        cons.forEach(([k, v]) => {
          d.ensure(30);
          d.text(C.t(k), { size: 8, bold: true, color: INK.muted });
          d.text(v, { size: 9.2 });
          d.space(4);
        });
      }
      [['affordances', p.affordances], ['indicators', p.indicators]].forEach(([k, v]) => {
        if (!String(v || '').trim()) return;
        d.h2(C.t(k));
        d.text(v, { size: 9.4 });
      });
      if (p.reviewDate) {
        d.space(6);
        d.text(C.t('reviewDate') + ': ' + C.fmtDate(p.reviewDate), { size: 8.6, bold: true, color: INK.muted });
      }
    }

    // diário
    if (S.diario && logs.length) {
      d.footer(d.footNote); d.addPage();
      d.h1(C.T2.tabs.diario[C.lang]);
      d.text(periodLabel(C, o.range), { size: 8.4, color: INK.muted });
      d.space(6);

          x: M.l + 12, y: A4.h - (d.y + 10), size: 9, font: d.fb, color: hex2rgb(INK.primary)
        });
        d.page.drawText(s[0], {
          x: A4.w - M.r - d.w(s[0], 7.6, true), y: A4.h - (d.y + 10), size: 7.6, font: d.fb, color: hex2rgb(s[1])
        });

    d.footer(d.footNote);
  }

  async function buildPeriod(pdf, fonts, o) {
    const C = ctx(o);
    const gks = o.goalkeepers;
    const d = Doc(pdf, fonts, {
      counter: o.counter, watermark: o.watermark, crest: o.crest, club: o.clubName, accent: o.accent,
      title: `${C.t('rpPeriod')} · ${periodLabel(C, o.range)}`,
      footNote: `${o.clubName} · ${C.t('rpGenerated')} ${C.fmtDate(o.today)}`
    });
    if (o.crestImg) d.crestImg = o.crestImg;
    d.addPage();
    d.h1(C.t('rpPeriod'));
    d.text(periodLabel(C, o.range), { size: 10, bold: true, color: INK.primary });
    d.space(8);

    const rows = gks.map(g => {
      const s = o.assessments.filter(a => a.goalkeeper_id === g.id && inRange(a.date, o.range))
        .sort((a, b) => a.date.localeCompare(b.date));
      if (!s.length) return null;
      const a0 = s[0].scores, a1 = s[s.length - 1].scores;
      return {
        g, n: s.length, from: s[0].date, to: s[s.length - 1].date,
        start: C.globalAvg(a0), end: C.globalAvg(a1),
        axes: C.AXES.map(k => ({ k, d: C.axisAvg(k, a1) - C.axisAvg(k, a0) })),
        a0, a1
      };
    }).filter(Boolean);

    if (!rows.length) {
      d.note(C.t('rpNoDataPeriod'));
      d.footer(d.footNote);
      return;
    }

    d.h2(C.t('rpWhatChanged'));
    d.table(
      [C.t('gkCol'), C.t('rpStart'), C.t('rpEnd'), C.t('delta'), ...C.AXES.map(k => C.axLabel(k, 'micro'))],
      rows.slice().sort((a, b) => (b.end - b.start) - (a.end - a.start)).map(r => {
        const dd = r.end - r.start;
        return {
          cells: [
            { t: C.nameOf(r.g), c: o.seriesColors[gks.indexOf(r.g) % o.seriesColors.length] },
            C.n1(r.start), { t: C.n1(r.end), b: true },
            { t: (dd > 0 ? '▲ +' : dd < 0 ? '▼ ' : '') + (dd ? Math.abs(dd).toFixed(1) : '0.0'), b: true, ink: dd > 0 ? INK.good : dd < 0 ? INK.bad : INK.muted },
            ...r.axes.map(a => ({
              t: (a.d > 0 ? '+' : '') + a.d.toFixed(1),
              ink: a.d > 0 ? INK.good : a.d < 0 ? INK.bad : INK.muted
            }))
          ]
        };
      }),
      [30, 12, 12, 14].concat(C.AXES.map(() => 10.6))
    );

    // maiores movimentos por competência
    d.h2(C.t('rpBiggestMoves'));
    const moves = [];
    rows.forEach(r => {
      C.allItems.forEach(i => {
        const a = +r.a0[i.id] || 0, b = +r.a1[i.id] || 0;
        if (a && b && a !== b) moves.push({ g: r.g, item: i, d: b - a, from: a, to: b });
      });
    });
    moves.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    const ups = moves.filter(m => m.d > 0).slice(0, 8);
    const downs = moves.filter(m => m.d < 0).slice(0, 6);
    if (ups.length) {
      d.text(C.t('rpUps'), { size: 8, bold: true, color: INK.good });
      d.space(3);
      d.table([C.t('gkCol'), C.t('delta')],
        ups.map(m => ({ cells: [`${C.shortOf(m.g)} — ${C.itemLabel(m.item)}`, { t: `${m.from} → ${m.to}  (+${m.d})`, b: true, ink: INK.good }] })),
        [74, 26], { rowH: 15 });
    }
    if (downs.length) {
      d.space(4);
      d.text(C.t('rpDowns'), { size: 8, bold: true, color: INK.bad });
      d.space(3);
      d.table([C.t('gkCol'), C.t('delta')],
        downs.map(m => ({ cells: [`${C.shortOf(m.g)} — ${C.itemLabel(m.item)}`, { t: `${m.from} → ${m.to}  (${m.d})`, b: true, ink: INK.bad }] })),
        [74, 26], { rowH: 15 });
    }

    // diário do período
    const logs = o.logs.filter(l => inRange(l.date, o.range))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (logs.length) {
      d.footer(d.footNote); d.addPage();
      d.h1(C.T2.tabs.diario[C.lang]);
      const byGk = {};
      logs.forEach(l => (byGk[l.goalkeeper_id] = byGk[l.goalkeeper_id] || []).push(l));
      const stMap = { good: [C.t('statusGood'), INK.good], warn: [C.t('statusWarn'), '#b07d00'], crit: [C.t('statusCrit'), INK.bad] };
      gks.forEach(g => {
        const ls = byGk[g.id]; if (!ls) return;
        d.h2(C.nameOf(g));
        ls.forEach(l => {
          d.ensure(44);
          const s = stMap[l.status] || stMap.good;
          d.page.drawRectangle({ x: M.l, y: A4.h - (d.y + 9), width: 5, height: 5, color: hex2rgb(s[1]) });
          d.page.drawText(`${C.fmtDate(l.date)}${l.cycle ? '  ·  ' + l.cycle : ''}`, {
            x: M.l + 11, y: A4.h - (d.y + 9), size: 8.6, font: d.fb, color: hex2rgb(INK.primary)
          });
          d.y += 14;
          [['entryProgress', l.progress], ['entryLimit', l.limitation], ['entryNext', l.next_step]]
            .filter(([, v]) => String(v || '').trim())
            .forEach(([k, v]) => {
              d.text(C.t(k) + ': ' + v, { size: 8.4, x: M.l + 11, maxW: CW - 11 });
            });
          d.space(6);
        });
      });
    }
    d.footer(d.footNote);
  }

  /* ---------- imagens ---------- */
  /* O objeto de imagem pertence a um PDF específico: reaproveitá-lo em
     outro documento gera um XObject inválido. Por isso o cache é por PDF. */
  const imgCache = new WeakMap();
  async function embedImg(pdf, dataUrl) {
    if (!dataUrl || !pdf) return null;
    let perDoc = imgCache.get(pdf);
    if (!perDoc) { perDoc = new Map(); imgCache.set(pdf, perDoc); }
    const key = dataUrl.length + '|' + dataUrl.slice(-48);
    if (perDoc.has(key)) return perDoc.get(key);
    try {
      const bytes = dataUrlToBytes(dataUrl);
      const img = /^data:image\/png/i.test(dataUrl) ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);
      perDoc.set(key, img);
      return img;
    } catch (e) { return null; }
  }

  /* =============================================================
     API
     ============================================================= */
  async function generate(o, onProgress) {
    const fontBytes = await ensureLibs(onProgress);
    const out = [];
    const slug = s => String(s || 'arquivo').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zA-Z0-9Ѐ-ӿ]+/g, '_').replace(/^_|_$/g, '').slice(0, 46) || 'arquivo';
    const C = ctx(o);
    const tag = (o.range && (o.range.from || o.range.to)
      ? `_${(o.range.from || '').replace(/-/g, '')}-${(o.range.to || '').replace(/-/g, '')}`
      : `_${o.today.replace(/-/g, '')}`) + (o.langSuffix ? '_' + o.lang.toUpperCase() : '');

    /* Space Grotesk (a fonte do sistema) não tem cirílico: o texto sairia como
       quadradinhos. Então cada documento escolhe um par só — Grotesk quando o
       conteúdo é latino, DejaVu quando aparece cirílico ou o idioma é russo. */
    const TEM_CIRILICO = /[\u0400-\u04FF]/;
    function precisaCirilico(gk) {
      if (o.lang === 'ru') return true;
      const partes = [o.clubName, o.respName, o.respRole];
      const junta = v => {
        if (v == null) return;
        if (typeof v === 'string') { partes.push(v); return; }
        if (Array.isArray(v)) { v.forEach(junta); return; }
        if (typeof v === 'object') Object.keys(v).forEach(k => junta(v[k]));
      };
      junta(gk);
      junta((o.model && o.model.axes) || []);
      junta(o.logs || []);
      return TEM_CIRILICO.test(partes.join(' '));
    }
    async function newDoc(gk) {
      const pdf = await PDFLib.PDFDocument.create();
      pdf.registerFontkit(window.fontkit);
      const counter = { n: 0 };
      const usaGrotesk = fontBytes.grotesk && !precisaCirilico(gk);
      const par = usaGrotesk ? fontBytes.grotesk : fontBytes;
      let fonts;
      try {
        fonts = {
          reg: await pdf.embedFont(par.reg, { subset: true }),
          bold: await pdf.embedFont(par.bold, { subset: true })
        };
      } catch (e) {
        console.warn('[perfil] fonte do sistema falhou, usando DejaVu:', e.message);
        fonts = {
          reg: await pdf.embedFont(fontBytes.reg, { subset: true }),
          bold: await pdf.embedFont(fontBytes.bold, { subset: true })
        };
      }
      /* monoespaçada dos rótulos pequenos, igual ao Minutes */
      fonts.mono = fonts.reg;
      if (fontBytes.mono && usaGrotesk) {
        try { fonts.mono = await pdf.embedFont(fontBytes.mono, { subset: true }); } catch (e) {}
      }
      pdf.setTitle(o.clubName + ' · ' + C.t('rpTitle'));
      pdf.setProducer(o.clubName);
      pdf.setCreator(o.clubName);
      return { pdf, fonts, counter };
    }

    const gks = o.goalkeepers;
    const wants = o.types || {};

    // ---- arquivos individuais ----
    if (o.individualFiles && (wants.individual || wants.onePager)) {
      for (let i = 0; i < gks.length; i++) {
        const g = gks[i];
        if (onProgress) onProgress('gk', { i: i + 1, n: gks.length, name: C.nameOf(g) });
        const { pdf, fonts, counter } = await newDoc(g);
        const oo = Object.assign({}, o, { counter });
        if (o.cover) {
          await drawCover(pdf, fonts, oo, {
            kind: wants.individual ? C.t('rpIndividual') : C.t('rpOnePager'),
            title: C.nameOf(g),
            subtitle: [g.number ? '#' + g.number : '', g.team].filter(Boolean).join('  ·  '),
            season: g.season || '',
            period: periodLabel(C, o.range)
          });
        }
        oo.crestImg = o.crest ? await embedImg(pdf, o.crest) : null;
        if (wants.individual) await buildIndividual(pdf, fonts, oo, g);
        if (wants.onePager) await buildOnePager(pdf, fonts, oo, g);
        out.push({ name: `${slug(C.nameOf(g))}${tag}.pdf`, bytes: await pdf.save() });
      }
    }

    // ---- consolidado ----
    if (o.consolidated) {
      if (onProgress) onProgress('consolidated');
      const { pdf, fonts, counter } = await newDoc(gks);
      const oo = Object.assign({}, o, { counter });
      if (o.cover && gks.length) {
        const kinds = [];
        if (wants.squad) kinds.push(C.t('rpSquad'));
        if (wants.period) kinds.push(C.t('rpPeriod'));
        if (wants.onePager) kinds.push(C.t('rpOnePager'));
        if (wants.individual) kinds.push(C.t('rpIndividual'));
        await drawCover(pdf, fonts, oo, {
          kind: C.t('rpCoverAll'),
          title: C.t('rpCoverSquad'),
          subtitle: kinds.join('  ·  '),
          season: gks[0] ? (gks[0].season || '') : '',
          period: periodLabel(C, o.range),
          count: gks.length
        });
      }
      oo.crestImg = o.crest ? await embedImg(pdf, o.crest) : null;
      let any = false;
      if (wants.squad && gks.length) { await buildSquad(pdf, fonts, oo); any = true; }
      if (wants.period && gks.length) { await buildPeriod(pdf, fonts, oo); any = true; }
      if (wants.onePager) { for (const g of gks) { await buildOnePager(pdf, fonts, oo, g); any = true; } }
      if (wants.individual) { for (const g of gks) { await buildIndividual(pdf, fonts, oo, g); any = true; } }
      if (any) out.push({ name: `${slug(o.clubName)}_${slug(C.t('rpSquadFile'))}${tag}.pdf`, bytes: await pdf.save() });
    }

    return out;
  }

  async function zipFiles(files, name) {
    const zip = new JSZip();
    files.forEach(f => zip.file(f.name, f.bytes));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    return { name, blob };
  }

  window.Reports = { generate, ensureLibs, zipFiles, setMessages: m => { MSG = Object.assign(MSG, m || {}); } };
})();

  function focoAtual() {
    const el = document.activeElement;
    if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
    let sel = '';
    if (el.id) sel = '#' + CSS.escape(el.id);
    else if (el.dataset.p) sel = '[data-p="' + el.dataset.p + '"]';
    else if (el.dataset.list) sel = '[data-list="' + el.dataset.list + '"][data-idx="' + el.dataset.idx + '"]';

    else if (el.dataset.score) sel = '[data-score="' + el.dataset.score + '"]';
    if (!sel) return null;
    let ini = null, fim = null;
    try { ini = el.selectionStart; fim = el.selectionEnd; } catch (e) {}
    return { sel: sel, ini: ini, fim: fim, valor: el.value };
  }
  function restauraFoco(f) {
    if (!f) return;
    const el = document.querySelector(f.sel);
    if (!el || el === document.activeElement) return;
    /* o texto pode ter chegado do servidor com atraso: mantem o que o usuario
       digitou para nao apagar as ultimas letras */
    if (f.valor != null && el.value !== f.valor && document.hasFocus()) el.value = f.valor;
    try {
      el.focus({ preventScroll: true });
      if (f.ini != null && el.setSelectionRange) el.setSelectionRange(f.ini, f.fim);

    return arr.length ? arr[arr.length - 1] : null;

  function ultimoComentario() {
    const a2 = ultimaAvaliacaoComNota();
    return a2 ? a2.note : '';
  }
  function critRow(item, axis) {
    const v = +(App.cur.scores || {})[item.id] || 0;
    const open = !!App.openNotes[item.id];
    const note = (App.cur.item_notes || {})[item.id] || '';
    return `
    <div class="crit-row">

        <input type="range" min="0" max="${SMAX()}" step="1" value="${v}" data-score="${item.id}"
               style="--sc:${seriesVar(AXCOLOR(axis))}" aria-label="${esc(item[L()])}">
        <div class="score" data-sv="${item.id}"${v ? '' : ' data-zero="1"'}>${v || '–'}</div>

  function gkEvol() {
    const snaps = App.curAssess;
    const lineHTML = snaps.length >= 2
      ? Charts.legendHTML(AXIDS().map(k => ({ label: AXLAB(k, 'short'), color: seriesVar(AXCOLOR(k)) }))) +
      Charts.multiLine(AXIDS().map(k => ({
        label: AXLAB(k, 'short'),
        color: seriesVar(AXCOLOR(k)),
        points: snaps.map(s => ({ t: s.date, y: axisAvg(k, s.scores) }))
      })), { height: 280, formatX: fmtShort, yMax: SMAX(), ticks: ModelKit.ticks(App.model) })
      : `<div class="empty">${esc(t('noSnapshots'))}</div>`;

    const bars = Charts.groupedBars(AXIDS().map(k => ({
      title: AXLAB(k, 'short'),
      rows: AX(k).items.map(i => ({ label: i[L()], values: [+(App.cur.scores || {})[i.id] || 0] }))
    })), [{ label: t('current'), color: 'var(--series-1)' }], { max: SMAX() });

    const first = snaps.length ? snaps[0].scores : null;
    const cmp = AXIDS().map(k => {
      const head = `<tr class="grp"><td colspan="4"><b style="font-size:11.5px;letter-spacing:.04em;color:var(--muted)">${esc(AXLAB(k, 'short').toUpperCase())}</b></td></tr>`;
      return head + AX(k).items.map(i => {
        const cur = +(App.cur.scores || {})[i.id] || 0;
        const f = first ? (+first[i.id] || 0) : 0;
        const d = (first && f && cur) ? cur - f : null;
        const dt = d == null ? '—' : d > 0 ? `<span class="delta-up">▲ +${d}</span>` : d < 0 ? `<span class="delta-dn">▼ ${d}</span>` : '0';
        return `<tr><td>${esc(i[L()])}</td><td>${f || '–'}</td><td>${cur || '–'}</td><td>${dt}</td></tr>`;
      }).join('');
    }).join('');

    const cycles = snaps.length
      ? `<table class="dt"><thead><tr><th>${esc(t('entryDate'))}</th>${AXIDS().map(k => `<th>${esc(AXLAB(k, 'short'))}</th>`).join('')}<th>${esc(t('avgGlobal'))}</th><th></th></tr></thead><tbody>
        ${snaps.map(s => `<tr><td>${esc(fmtDate(s.date))}</td>${AXIDS().map(k => `<td>${n1(axisAvg(k, s.scores))}</td>`).join('')}<td><b>${n1(globalAvg(s.scores))}</b></td>
          <td class="no-print" style="white-space:nowrap">
            <button class="btn sm ghost" data-editsnap="${s.id}">${esc(t('editSnap'))}</button>
            <button class="btn sm ghost danger" data-rmsnap="${s.id}">${esc(t('deleteCycle'))}</button></td></tr>`).join('')}
      </tbody></table>`
      : `<div class="empty">${esc(t('noSnapshots'))}</div>`;

    return `
    <div class="card"><h3>${esc(T.tabs.evol[L()])}</h3>
      <div class="hint" style="margin-bottom:14px">${esc(t('evolIntro'))}</div>${lineHTML}</div>
    <div class="card"><h3>${esc(t('current'))}</h3>${bars}</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <h3 class="ttl" style="margin:0">${esc(t('compareTitle'))}</h3>
        <button class="btn sm ghost no-print" id="tblBtn" style="margin-left:auto">${esc(App.showTable ? t('hideTable') : t('tableView'))}</button>
      </div>
      <div style="display:${App.showTable ? 'block' : 'none'}">
        <table class="dt"><thead><tr><th></th><th>${esc(t('first'))}</th><th>${esc(t('current'))}</th><th>${esc(t('delta'))}</th></tr></thead>
        <tbody>${cmp}</tbody></table>
      </div>
    </div>
    <div class="card"><h3>${esc(t('cycles'))}</h3>${cycles}</div>`;
  }

  function wireGkCharts() {
    const snaps = App.curAssess;
    if (snaps.length < 2) return;
    const series = AXIDS().map(k => ({
      label: AXLAB(k, 'short'), color: seriesVar(AXCOLOR(k)),

  function pickBar() {
    const list = App.gks.filter(g => !g.archived);
    return `<div class="pickbar">${list.map(g => {
      const on = App.sel.indexOf(g.id) >= 0;
      return `<button class="pick" data-pick="${g.id}" aria-pressed="${on}">

  function metricSeg(id) {
    const opts = [['global', t('avgGlobal')]].concat(AXIDS().map(k => [k, AXLAB(k, 'short')]));
    return `<div class="seg" id="${id}">${opts.map(([v, l]) =>
      `<button data-metric="${v}" aria-pressed="${App.metric === v}">${esc(l)}</button>`).join('')}</div>`;
  }

  function selectedGks() {
    return App.sel.map(id => App.gks.find(g => g.id === id)).filter(Boolean);
  }

  function viewCompare() {
    const sel = selectedGks();
    const head = `<div class="page-head"><h2>${esc(t('compareTitle2'))}</h2></div>
      <div class="card"><div class="hint" style="margin-bottom:12px">${esc(t('compareIntro'))}</div>${pickBar()}</div>`;
    if (sel.length < 2) return head + `<div class="empty">${esc(t('pickAtLeast'))}</div>`;

    const legend = sel.map(g => ({ label: gkName(g), color: colorOfSel(g.id) }));

    // médias por eixo
    const axisBars = Charts.groupedBars([{
      title: '', rows: AXIDS().map(k => ({
        label: AXLAB(k), values: sel.map(g => axisAvg(k, g.scores))
      })).concat([{ label: t('avgGlobal'), values: sel.map(g => globalAvg(g.scores)) }])
    }], legend, { labelWidth: 300, max: SMAX() });

    // competência a competência
    const compBars = Charts.groupedBars(AXIDS().map(k => ({
      title: AXLAB(k, 'short'),
      rows: AX(k).items.map(i => ({ label: i[L()], values: sel.map(g => +(g.scores || {})[i.id] || 0) }))
    })), legend, { labelWidth: 286, max: SMAX() });

    // evolução
    const series = sel.map(g => ({
      label: gkName(g), short: shortName(g), color: colorOfSel(g.id),
      points: assessOf(g.id).map(s => ({ t: s.date, y: metricOf(s.scores, App.metric) }))
    })).filter(s => s.points.length);
    const hasLine = series.some(s => s.points.length >= 2);
    const lineHTML = hasLine
      ? Charts.multiLine(series, { height: 290, formatX: fmtShort, nameLabels: true, yMax: SMAX(), ticks: ModelKit.ticks(App.model) })
      : `<div class="empty">${esc(t('needTwoAssess'))}</div>`;

    // tabela
    const base = sel[0];
    const rows = AXIDS().map(k => {
      const h = `<tr class="grp"><td colspan="${sel.length + 1}"><b style="font-size:11.5px;color:var(--muted);letter-spacing:.04em">${esc(AXLAB(k, 'short').toUpperCase())}</b></td></tr>`;
      return h + AX(k).items.map(i => `<tr><td>${esc(i[L()])}</td>${sel.map((g, gi) => {
        const v = +(g.scores || {})[i.id] || 0;
        const b = +(base.scores || {})[i.id] || 0;
        const d = gi === 0 || !v || !b ? null : v - b;
        return `<td>${v || '–'}${d ? ` <span class="${d > 0 ? 'delta-up' : 'delta-dn'}" style="font-size:11px">${d > 0 ? '+' : ''}${d}</span>` : ''}</td>`;
      }).join('')}</tr>`).join('');
    }).join('');

    return head + `
    <div class="card"><h3>${esc(t('byAxis'))}</h3>${Charts.legendHTML(legend)}${axisBars}</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <h3 class="ttl" style="margin:0">${esc(t('overTime'))}</h3>
        <div class="spacer"></div><span class="hint">${esc(t('metric'))}</span>${metricSeg('cmpMetric')}
      </div>${Charts.legendHTML(legend)}${lineHTML}</div>
    <div class="card"><h3>${esc(t('byCompetency'))}</h3>${Charts.legendHTML(legend)}${compBars}</div>
    <div class="card"><h3>${esc(t('byCompetency'))} — ${esc(t('tableView'))}</h3>
      <div class="hint" style="margin-bottom:6px">${esc(t('diffNote'))}</div>
      <table class="dt"><thead><tr><th></th>${sel.map(g =>
      `<th><span class="swatch" style="background:${colorOfSel(g.id)}"></span>${esc(gkName(g))}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  function wireCompareCharts() {
    const sel = selectedGks(); if (sel.length < 2) return;

  function squadAvgSeries() {
    const byDate = {};
    App.gks.filter(g => !g.archived).forEach(g => {
      assessOf(g.id).forEach(s => {
        const v = metricOf(s.scores, App.metric);
        if (!v) return;
        (byDate[s.date] = byDate[s.date] || []).push(v);
      });
    });
    const pts = Object.keys(byDate).sort().map(d => ({
      t: d, y: byDate[d].reduce((a, b) => a + b, 0) / byDate[d].length
    }));
    return pts;
  }

  function legibilityCard(d) {
    const n = auditCount();
    const cols = (d.use_in_charts && d.colors.length) ? ColorKit.buildSeries(d.colors, 'light')
      : ColorKit.DEFAULTS.light.slice();
    const colsD = (d.use_in_charts && d.colors.length) ? ColorKit.buildSeries(d.colors, 'dark')
      : ColorKit.DEFAULTS.dark.slice();
    const aL = ColorKit.audit(cols, 'light', n), aD = ColorKit.audit(colsD, 'dark', n);
    const level = (aL.level === 'bad' || aD.level === 'bad') ? 'bad'
      : (aL.level === 'warn' || aD.level === 'warn') ? 'warn' : 'ok';
    const msg = level === 'bad' ? t('legBad') : level === 'warn' ? t('legWarn') : t('legOk');
    const dropped = d.use_in_charts && d.colors.filter(c => ColorKit.isHex(c) && !ColorKit.isNeutral(c)).length >
      cols.filter(c => d.colors.some(k => ColorKit.isHex(k) && ColorKit.deltaE(ColorKit.snapToBand(k, 'light') || '#000000', c) < 1)).length;
    return `<div class="legibility" data-level="${level}">
      <div class="leg-head"><i></i><b>${esc(t('legibility'))}</b>
        <span>${esc(t('legFor'))} ${n} ${esc(t('gksAtOnce'))}</span></div>

  /* abreviacao curta para as caixinhas do elenco: iniciais das palavras, ou as
     tres primeiras letras quando o nome tem uma palavra so */
  function abreviar(txt) {
    const s2 = String(txt || '').trim();
    if (!s2) return '';
    const p = s2.split(/\s+/).filter(w => w.length > 2 || /^[0-9]/.test(w));
    if (p.length >= 2) return p.slice(0, 3).map(w => w[0]).join('').toUpperCase();
    return s2.slice(0, 3).toUpperCase();
  }
  function novoEixo(m) {
    const n = m.axes.length + 1;
    const nome = t('pmNewAxis') + ' ' + n;
    return {
      id: ModelKit.uid('ax'),
      label: { pt: nome, en: nome, ru: nome },
      short: { pt: nome, en: nome, ru: nome },
      micro: { pt: 'E' + n, en: 'A' + n, ru: 'Н' + n },
      items: [{ id: ModelKit.uid('it'), pt: '', en: '', ru: '' }]
    };
  }

  function levelColorFor(m, v) {
    const min = m.scale.min, max = m.scale.max;
    const n = Math.max(1, max - min);
    const r = (v - min) / n;
    return r < 0.25 ? 'var(--crit)' : r < 0.55 ? 'var(--warn)' : r < 0.85 ? 'var(--series-1)' : 'var(--good)';
  }

  function setDeep(obj, path, val) {
    const ks = path.split('.');
    let o = obj;
    for (let i = 0; i < ks.length - 1; i++) {
      const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i];
      o = o[k];
      if (o == null) return;
    }
    const last = /^\d+$/.test(ks[ks.length - 1]) ? +ks[ks.length - 1] : ks[ks.length - 1];
    o[last] = val;
  }

  function wireParams() {
    const m = modelDraft();
    document.querySelectorAll('[data-m]').forEach(inp => {
      inp.oninput = () => { setDeep(m, inp.dataset.m, inp.value); };
    });
    /* campo unico: o mesmo texto vai para pt/en/ru e guarda o idioma de origem */
    document.querySelectorAll('[data-mall]').forEach(inp => {
      inp.oninput = () => {
        const base = inp.dataset.mall, v = inp.value;
        setDeep(m, base + '.pt', v);
        setDeep(m, base + '.en', v);
        setDeep(m, base + '.ru', v);
        setDeep(m, base + '.src', '');
      };
    });
    const mn = $('#pmMin'), mx = $('#pmMax');
    const syncScale = () => {
      const a = parseInt(mn.value, 10), b = parseInt(mx.value, 10);
      m.scale.min = isNaN(a) ? 1 : Math.max(0, Math.min(9, a));
      m.scale.max = isNaN(b) ? 5 : Math.max(m.scale.min + 1, Math.min(20, b));
      const norm = ModelKit.normalize(m);
      m.scale = norm.scale; m.levels = norm.levels;
      App.modelDraft = m;
      render();
    };
    if (mn) mn.onchange = syncScale;
    if (mx) mx.onchange = syncScale;
    const sv = $('#pmSave'); if (sv) sv.onclick = saveModel;
    const rs = $('#pmRestore');
    if (rs) rs.onclick = () => {
      if (!confirm(t('pmConfirmRestore'))) return;
      App.modelDraft = ModelKit.normalize(ModelKit.factory());
      render();
    };
  }

  async function saveModel() {
    const m = modelDraft();
    // valida: tudo precisa de um nome em português
    const vazio = o => !String((o && (o.pt || o.en || o.ru)) || '').trim();
    const bad = m.axes.some(a => vazio(a.label))
      || m.axes.some(a => a.items.some(vazio));
    if (bad) { toast(t('pmNeedName')); return; }
    /* nenhum campo pode ficar vazio: o que nao tiver versao propria repete o
       texto escrito, para o relatorio nunca sair com um espaco em branco */
    m.axes.forEach(ax => {
      const compl = obj => {
        if (!obj) return;
        const base = String(obj.pt || obj.en || obj.ru || '').trim();
        if (!base) return;
        if (!String(obj.pt || '').trim()) obj.pt = base;
        if (!String(obj.en || '').trim()) obj.en = base;
        if (!String(obj.ru || '').trim()) obj.ru = base;
      };
      compl(ax.label);
      /* "Curto" e "Mínimo" nao sao mais editaveis na tela, entao passam a ser
         derivados do nome do eixo. Antes ficavam congelados em "New axis N" e
         era isso que saia nos graficos e no PDF. */
      ax.short = { pt: ax.label.pt, en: ax.label.en, ru: ax.label.ru };
      ax.micro = {
        pt: abreviar(ax.label.pt), en: abreviar(ax.label.en), ru: abreviar(ax.label.ru)
      };
      ax.items.forEach(compl);
    });

    const oldScale = { min: App.model.scale.min, max: App.model.scale.max };
    const newModel = ModelKit.normalize(m);
    const convert = $('#pmConvert') ? $('#pmConvert').checked : true;
    const scaleChanged = oldScale.min !== newModel.scale.min || oldScale.max !== newModel.scale.max;

    const btn = $('#pmSave'); if (btn) btn.disabled = true;
    const st = $('#pmStatus');
    try {
      if (scaleChanged && convert) {
        if (st) st.textContent = t('pmConverting');
        for (const g of App.gks) {
          const sc = ModelKit.convertScores(g.scores || {}, oldScale, newModel.scale);
          await App.db.updateGoalkeeper(g.id, { scores: sc });
          g.scores = sc;
        }
        const all = await App.db.listAssessments(null);
        for (const s of all) {
          const sc = ModelKit.convertScores(s.scores || {}, oldScale, newModel.scale);
          await App.db.upsertAssessment(s.goalkeeper_id, s.date, sc, s.note || '');
        }
        App.allAssess = await App.db.listAssessments(null);
        if (App.cur) {
          App.curAssess = App.allAssess.filter(x => x.goalkeeper_id === App.cur.id)
            .sort((x, y) => x.date.localeCompare(y.date));
        }
      }
      await App.db.saveModel(newModel);
      App.model = newModel;
      App.modelDraft = null;
      App.metric = 'global';
      App.view = 'squad';
      render();
      toast(t('pmSaved'));
    } catch (e) {
      toast(e.message || String(e));
      if (btn) btn.disabled = false;
      if (st) st.textContent = '';
    }
  }

  function rpRange() {
    const r = App.rp;
    const iso = d => d.toISOString().slice(0, 10);
    if (r.preset === 'season') return { from: '', to: '' };
    if (r.preset === 'd30' || r.preset === 'd90') {
      const n = r.preset === 'd30' ? 30 : 90;
      const to = new Date();
      const from = new Date(Date.now() - n * 864e5);
      return { from: iso(from), to: iso(to) };
    }
    return { from: r.from || '', to: r.to || '' };
  }
  function rpLangs() {
    const r = App.rp;
    return (r.langs && r.langs.length) ? r.langs.slice() : [App.lang];
  }

  /* Salvar escolhendo a pasta. O navegador so abre o seletor durante um clique
     do usuario, entao os relatorios ficam listados e cada botao salva. Sem
     suporte (Safari, Firefox) cai no download normal. */
  const podeEscolher = () => typeof window.showSaveFilePicker === 'function';
  const podePasta = () => typeof window.showDirectoryPicker === 'function';
  async function saveBlob(blob, name) {
    if (App.rp.ask && podeEscolher()) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }]
        });
        const w = await h.createWritable();
        await w.write(blob); await w.close();
        toast(t('rpSaved'));
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') return false;   /* cancelou: nao baixa */
      }
    }
    downloadBlob(blob, name);
    return true;
  }
  /* varios arquivos de uma vez, direto numa pasta */
  async function saveAllToFolder(files) {
    if (!(App.rp.ask && podePasta())) {
      const pack = await Reports.zipFiles(files, 'relatorios_' + today() + '.zip');
      return saveBlob(pack.blob, pack.name);
    }
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { return false; }
    for (const f of files) {
      const h = await dir.getFileHandle(f.name, { create: true });
      const w = await h.createWritable();
      await w.write(new Blob([f.bytes], { type: 'application/pdf' }));
      await w.close();
    }
    toast(t('rpSavedN').replace('{n}', files.length));
    return true;
  }
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 6000);
  }

  function wireReports() {
    const r = App.rp;
    document.querySelectorAll('[data-rpsec]').forEach(c => {
      c.onchange = () => { r.secs[c.dataset.rpsec] = c.checked; render(); };
    });
    document.querySelectorAll('[data-rptype]').forEach(c => {
      c.onchange = () => {
        const k = c.dataset.rptype;
        r.types[k] = c.checked;
        /* "Uma pagina por atleta" e o resumo do "Relatorio de desenvolvimento".
           Marcados juntos, o PDF trazia os mesmos goleiros duas vezes — todos
           os resumos e depois todos os completos, com pontos fortes e perfil
           repetidos. Agora marcar um desmarca o outro. */
        if (c.checked && k === 'individual') r.types.onePager = false;
        if (c.checked && k === 'onePager') r.types.individual = false;
        render();
      };
    });
    const f = $('#rpFrom'), tt = $('#rpTo');
    if (f) f.onchange = () => { r.from = f.value; render(); };
    if (tt) tt.onchange = () => { r.to = tt.value; render(); };
    const ind = $('#rpIndFiles'); if (ind) ind.onchange = () => { r.individualFiles = ind.checked; };
    const con = $('#rpCons'); if (con) con.onchange = () => { r.consolidated = con.checked; };
    const cov = $('#rpCover'); if (cov) cov.onchange = () => { r.cover = cov.checked; };
    const wmk = $('#rpWmk'); if (wmk) wmk.onchange = () => { r.watermark = wmk.checked; };
    const ask = $('#rpAsk');
    if (ask) ask.onchange = () => {
      r.ask = ask.checked;
      try { localStorage.setItem('fluxgk.profile.askSave', ask.checked ? '1' : '0'); } catch (e) {}
    };
    const go = $('#rpGo'); if (go) go.onclick = runReports;
    const zip = $('#rpZip');
    if (zip) zip.onclick = async () => {
      const pack = await Reports.zipFiles(r.results, 'relatorios_' + today() + '.zip');
      await saveBlob(pack.blob, pack.name);
    };
    const all = $('#rpSaveAll');
    if (all) all.onclick = async () => { await saveAllToFolder(r.results || []); };
    document.querySelectorAll('[data-rpfile]').forEach(b => {
      b.onclick = () => {
        const file = r.results[+b.dataset.rpfile];
        saveBlob(new Blob([file.bytes], { type: 'application/pdf' }), file.name);
      };
    });
  }

  async function runReports() {
    const r = App.rp;
    const sel = rpSelected();
    const anyType = Object.keys(r.types).some(k => r.types[k]);
    if (!anyType || !sel.length) { toast(t('rpNothing')); return; }

    r.busy = true; r.results = null; r.status = t('rpLoadingLibs'); render();
    const setStatus = s => { r.status = s; const el = $('#rpStatus'); if (el) el.textContent = s; };

    try {
      // garante que avaliações e diários de todos os selecionados estão carregados
      const logsAll = [];
      for (const g of sel) logsAll.push.apply(logsAll, await App.db.listLogs(g.id));
      App.allAssess = await App.db.listAssessments(null);

      const langs = rpLangs();
      const seriesColors = (App.brand.use_in_charts && App.brand.colors && App.brand.colors.length)
        ? ColorKit.buildSeries(App.brand.colors, 'light')
        : ColorKit.DEFAULTS.light.slice();
      const accent = seriesColors[0];
      const LNAME = { pt: 'PT', en: 'EN', ru: 'RU' };
      Reports.setMessages({ loadFail: t('rpLoadFail'), fontFail: t('rpFontFail') });

      // um conjunto completo de arquivos por idioma escolhido
      const files = [];
      for (const lang of langs) {
        const pref = langs.length > 1 ? LNAME[lang] + ' · ' : '';
        const part = await Reports.generate({
          goalkeepers: sel,
          assessments: App.allAssess,
          logs: logsAll,
          range: rpRange(),
          types: r.types,
          secs: r.secs,
          individualFiles: r.individualFiles,
          consolidated: r.consolidated,
          cover: r.cover, watermark: r.watermark,
          respName: App.brand.resp_name || '', respRole: App.brand.resp_role || '',
          clubColor: (App.brand.colors && App.brand.colors[0]) || null,
          lang, langSuffix: langs.length > 1,
          T, model: App.model,
          clubName: App.brand.club_name || 'Semey',
          crest: App.brand.crest,
          accent, seriesColors,
          today: today()
        }, (stage, info) => {
          if (stage === 'libs' || stage === 'fonts') setStatus(t('rpLoadingLibs'));
          else if (stage === 'gk') setStatus(`${pref}${t('rpGenerating')} ${info.i}/${info.n} — ${info.name}`);
          else if (stage === 'consolidated') setStatus(pref + t('rpGenerating') + ' — ' + t('rpConsolidated'));
        });
        files.push.apply(files, part);
      }

      r.results = files;
      r.status = `${t('rpDone')} · ${files.length} ${t('rpFiles')}`;
      /* com "escolher onde salvar" ligado nao baixa sozinho: o seletor de pasta
         so pode abrir a partir de um clique, entao os arquivos ficam listados */
      if (r.ask && (podeEscolher() || podePasta())) {
        r.status += ' · ' + t('rpPickToSave');
      } else if (files.length === 1) {
        downloadBlob(new Blob([files[0].bytes], { type: 'application/pdf' }), files[0].name);
      } else if (files.length > 1) {
        const pack = await Reports.zipFiles(files, 'relatorios_' + today() + '.zip');
        downloadBlob(pack.blob, pack.name);
      }
    } catch (e) {
      r.status = '';
      toast(e.message || String(e));
    } finally {
      r.busy = false;
      render();
    }
  }

  /* ---------------------------------------------------------------
     Notas fora da escala: acontece quando os dados foram criados com
     uma escala maior do que a atual. Uma nota acima do máximo não tem
     significado nenhum, então é convertida proporcionalmente.
     --------------------------------------------------------------- */
  async function fixOutOfRange() {
    const max = SMAX();
    let worst = 0;
    App.gks.forEach(g => Object.keys(g.scores || {}).forEach(k => {
      const v = +g.scores[k] || 0; if (v > worst) worst = v;
    }));
    App.allAssess.forEach(s => Object.keys(s.scores || {}).forEach(k => {
      const v = +s.scores[k] || 0; if (v > worst) worst = v;
    }));
    if (worst <= max) return false;

    const from = { min: ModelKit.scaleMin(App.model), max: Math.max(10, worst) };
    const to = App.model.scale;
    try {
      for (const g of App.gks) {
        const sc = ModelKit.convertScores(g.scores || {}, from, to);
        await App.db.updateGoalkeeper(g.id, { scores: sc });
        g.scores = sc;
      }
      for (const s of App.allAssess) {
        const sc = ModelKit.convertScores(s.scores || {}, from, to);
        await App.db.upsertAssessment(s.goalkeeper_id, s.date, sc, s.note || '');
      }
      App.allAssess = await App.db.listAssessments(null);
      if (App.cur) {
        App.curAssess = App.allAssess.filter(x => x.goalkeeper_id === App.cur.id)
          .sort((x, y) => x.date.localeCompare(y.date));
      }
      toast(t('rescaled').replace('{from}', from.min + '–' + from.max).replace('{to}', to.min + '–' + to.max));
      return true;
    } catch (e) {
      toast(e.message || String(e));
      return false;
    }
  }

  document.addEventListener('input', e => {
    const el = e.target;
    /* comentario qualitativo: fica em memoria ate salvar o snapshot */
    if (el.id === 'qualNote') { App.qualNote = el.value; return; }
    if (el.dataset && el.dataset.p) {
      setP(el.dataset.p, el.value);
      const top = el.dataset.p.split('.')[0];
      queueSave({ [top]: App.cur[top] });
      refreshHero();
      return;
    }
    if (el.dataset && el.dataset.list) {
      const k = el.dataset.list;
      if (!Array.isArray(App.cur[k])) App.cur[k] = [];
      App.cur[k][+el.dataset.idx] = el.value;
      queueSave({ [k]: App.cur[k] });
      return;
    }
    if (el.dataset && el.dataset.score) {
      const id = el.dataset.score, v = +el.value;
      App.cur.scores = Object.assign({}, App.cur.scores, { [id]: v });
      const sv = document.querySelector(`[data-sv="${id}"]`);
      if (sv) { sv.textContent = v || '–'; v ? sv.removeAttribute('data-zero') : sv.setAttribute('data-zero', '1'); }
      AXIDS().forEach(k => {
        const el2 = document.querySelector(`[data-axisavg="${k}"]`);
        if (el2) el2.textContent = n1(axisAvg(k, App.cur.scores));
      });
      const g = document.querySelector('[data-globalavg]');
      if (g) g.textContent = n1(globalAvg(App.cur.scores));
      queueSave({ scores: App.cur.scores });
      return;
    }
    if (el.dataset && el.dataset.log && el.tagName !== 'SELECT') {
      const [id, f] = el.dataset.log.split('|');
      const row = App.curLogs.find(l => l.id === id);
      if (row) { row[f] = el.value; debounceLog(id, { [f]: el.value }); }
    }
  });

  let logTimers = {};
  function debounceLog(id, patch) {
    clearTimeout(logTimers[id]);
    logTimers[id] = setTimeout(async () => {
      try { await App.db.updateLog(id, patch); markSave('saved'); }
      catch (e) { markSave('error'); toast(e.message); }
    }, 900);
    markSave('saving');
  }

  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.id === 'archToggle') { App.showArchived = el.checked; render(); return; }
    if (el.id === 'avgToggle') { App.showAvg = el.checked; render(); return; }
    if (el.dataset && el.dataset.log && el.tagName === 'SELECT') {
      const [id, f] = el.dataset.log.split('|');
      const row = App.curLogs.find(l => l.id === id);
      if (row) { row[f] = el.value; await App.db.updateLog(id, { [f]: el.value }); render(); }
    }
  });

  function refreshHero() {
    if (App.view !== 'gk' || App.tab !== 'geral' || !App.cur) return;
    const g = App.cur;
    const h = $('#heroName');
    if (h) {
      h.textContent = gkName(g);
      (g.name || '').trim() ? h.removeAttribute('data-empty') : h.setAttribute('data-empty', '1');
    }
    const sub = $('#heroSub');
    if (sub) sub.textContent = [g.number ? '#' + g.number : '', g.team, T.club[L()] + ' · ' + (g.season || '')].filter(Boolean).join(' · ');
    const chips = $('#heroChips');
    if (chips) {
      const a = age(g.birth);
      const vals = [a != null ? a : '—', g.height || '—', g.weight || '—', g.wingspan || '—', n1(globalAvg(g.scores))];
      chips.querySelectorAll('.chip b').forEach((b, i) => b.textContent = vals[i]);
    }
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('button, [data-open]');
    const pop = $('#menuPop');
    if (pop && !pop.hidden && !e.target.closest('#menuPop') && !(b && b.id === 'menuBtn')) pop.hidden = true;
    if (!b) return;

    if (b.dataset.menu) {
      const p = $('#menuPop'); if (p) p.hidden = true;
      if (b.dataset.menu === 'export') exportBackup();
      return;
    }
    if (b.dataset.open) { await flushSave(); openGk(b.dataset.open); return; }
    if (b.dataset.view) {
      await flushSave();
      if (b.dataset.view === 'params') App.modelDraft = null;
      App.view = b.dataset.view;
      if (b.dataset.view !== 'gk') App.cur = null, markSave('idle');
      render(); return;
    }
    if (b.dataset.gktab) { App.tab = b.dataset.gktab; render(); return; }
    if (b.dataset.metric) { App.metric = b.dataset.metric; render(); return; }
    if (b.dataset.mup || b.dataset.mdown) {
      const m = modelDraft();
      const i = +(b.dataset.mup || b.dataset.mdown);
      const j = b.dataset.mup ? i - 1 : i + 1;
      if (j >= 0 && j < m.axes.length) { const x = m.axes[i]; m.axes[i] = m.axes[j]; m.axes[j] = x; }
      render(); return;
    }
    if (b.dataset.miup || b.dataset.midown) {
      const m = modelDraft();
      const [ai, ii] = (b.dataset.miup || b.dataset.midown).split('.').map(Number);
      const arr = m.axes[ai].items;
      const j = b.dataset.miup ? ii - 1 : ii + 1;
      if (j >= 0 && j < arr.length) { const x = arr[ii]; arr[ii] = arr[j]; arr[j] = x; }
      render(); return;
    }
    if (b.dataset.mdelaxis) {
      if (!confirm(t('pmConfirmDelAxis'))) return;
      const m = modelDraft();
      m.axes.splice(+b.dataset.mdelaxis, 1);
      if (!m.axes.length) m.axes.push(novoEixo(m));
      render(); return;
    }
    if (b.dataset.mdelitem) {
      if (!confirm(t('pmConfirmDelItem'))) return;
      const m = modelDraft();
      const [ai, ii] = b.dataset.mdelitem.split('.').map(Number);
      m.axes[ai].items.splice(ii, 1);
      render(); return;
    }
    if (b.dataset.mbulkopen) {
      const cx = document.getElementById('pmBulk' + b.dataset.mbulkopen);
      if (cx) { cx.style.display = cx.style.display === 'none' ? '' : 'none';
        const ta = cx.querySelector('textarea'); if (ta && cx.style.display === '') ta.focus(); }
      return;
    }
    if (b.dataset.mbulkadd) {
      const ai = +b.dataset.mbulkadd;
      const ta = document.getElementById('pmBulkTxt' + ai);
      const linhas = String(ta && ta.value || '').split(/\r?\n/)
        .map(x => x.trim()).filter(Boolean);
      if (!linhas.length) { toast(t('pmBulkNone')); return; }
      const m = modelDraft();
      linhas.forEach(txt => {
        const it = { id: ModelKit.uid('it') };
        espelhar(it, txt);
        m.axes[ai].items.push(it);
      });
      toast(t('pmBulkDone').replace('{n}', linhas.length));
      render(); return;
    }
    if (b.dataset.madditem) {
      const m = modelDraft();
      m.axes[+b.dataset.madditem].items.push({
        id: ModelKit.uid('it'), pt: '', en: '', ru: ''
      });
      render(); return;
    }
    if (b.dataset.card) {
      const id = b.dataset.card;
      const atual = App.cardOpen[id] != null ? App.cardOpen[id] : App.cardsOpen;
      App.cardOpen[id] = !atual;
      render(); return;
    }
    if (b.dataset.rppreset) { App.rp.preset = b.dataset.rppreset; render(); return; }
    if (b.dataset.rplang) {
      const cur = rpLangs();
      const v = b.dataset.rplang, i = cur.indexOf(v);
      if (i >= 0) { if (cur.length > 1) cur.splice(i, 1); }
      else cur.push(v);
      App.rp.langs = ['pt', 'en', 'ru'].filter(l => cur.indexOf(l) >= 0);
      render(); return;
    }
    if (b.dataset.rppick) {
      const id = b.dataset.rppick;
      const all = App.gks.filter(g => !g.archived).map(g => g.id);
      let who = App.rp.who ? App.rp.who.slice() : all.slice();
      const i = who.indexOf(id);
      if (i >= 0) who.splice(i, 1); else who.push(id);
      App.rp.who = who.length === all.length ? null : who;
      render(); return;
    }
    if (b.dataset.pick) {
      const id = b.dataset.pick, i = App.sel.indexOf(id);
      if (i >= 0) App.sel.splice(i, 1);
      else if (App.sel.length < Charts.SLOTS) App.sel.push(id);
      render(); return;
    }
    if (b.dataset.note) { App.openNotes[b.dataset.note] = !App.openNotes[b.dataset.note]; render(); return; }
    if (b.dataset.addlist) {
      const k = b.dataset.addlist;
      App.cur[k] = (App.cur[k] || []).concat(['']);
      queueSave({ [k]: App.cur[k] }); render(); return;
    }
    if (b.dataset.uplist || b.dataset.dnlist) {
      const k = b.dataset.uplist || b.dataset.dnlist;
      const i = +b.dataset.idx, j = b.dataset.uplist ? i - 1 : i + 1;
      const arr = App.cur[k] || [];
      if (j >= 0 && j < arr.length) {
        const x = arr[i]; arr[i] = arr[j]; arr[j] = x;
        App.cur[k] = arr;
        queueSave({ [k]: arr });
        render();
      }
      return;
    }
    if (b.dataset.rmlist) {
      const k = b.dataset.rmlist;
      App.cur[k] = (App.cur[k] || []).filter((_, i) => i !== +b.dataset.idx);
      if (!App.cur[k].length) App.cur[k] = [''];
      queueSave({ [k]: App.cur[k] }); render(); return;
    }
    if (b.dataset.rmlog) {
      await App.db.deleteLog(b.dataset.rmlog);
      App.curLogs = App.curLogs.filter(l => l.id !== b.dataset.rmlog);
      render(); return;
    }
    if (b.dataset.editsnap) {
      const snap = (App.curAssess || []).find(x => x.id === b.dataset.editsnap);
      if (!snap) return;
      /* traz as notas e o comentário daquela data de volta para o formulário */
      App.cur.scores = Object.assign({}, snap.scores || {});
      App.qualNote = snap.note || '';
      App.editSnap = { id: snap.id, date: snap.date };
      queueSave({ scores: App.cur.scores });
      App.tab = 'aval';
      render(); return;
    }
    if (b.dataset.rmsnap) {
      if (!confirm(t('confirmDelete'))) return;
      await App.db.deleteAssessment(b.dataset.rmsnap);
      App.curAssess = App.curAssess.filter(s => s.id !== b.dataset.rmsnap);
      App.allAssess = App.allAssess.filter(s => s.id !== b.dataset.rmsnap);
      render(); return;
    }
    if (b.dataset.arch) {
      const g = App.gks.find(x => x.id === b.dataset.arch);
      if (!g) return;
      await App.db.updateGoalkeeper(g.id, { archived: !g.archived });
      g.archived = !g.archived;
      App.sel = App.sel.filter(id => id !== g.id);
      render(); return;
    }

    switch (b.id) {
      case 'menuBtn': {
        const p = $('#menuPop');
        if (p) p.hidden = !p.hidden;
        break;
      }
      case 'exportBtn': exportBackup(); break;
      case 'clearSel': App.sel = []; render(); break;
      case 'rpSecAll': {
        const faltando = RP_SECS.some(([k]) => !App.rp.secs[k]);
        RP_SECS.forEach(([k]) => { App.rp.secs[k] = faltando; });
        render(); break;
      }
      case 'rpAll': App.rp.who = null; render(); break;
      case 'rpLangAll': App.rp.langs = ['pt', 'en', 'ru']; render(); break;
      case 'rpLangReset': App.rp.langs = null; render(); break;
      case 'pmAddAxis': {
        const m = modelDraft();
        if (m.axes.length < ModelKit.MAXAXES) m.axes.push(novoEixo(m));
        render(); break;
      }
      case 'backBtn': await flushSave(); App.brandDraft = null; App.modelDraft = null; App.view = 'squad'; App.cur = null; markSave('idle'); render(); break;
      case 'printBtn': await printProfile(); break;
      case 'tblBtn': App.showTable = !App.showTable; render(); break;

      case 'addEntry': {
        const row = await App.db.createLog(App.cur.id, { date: today() });
        App.curLogs.unshift(row); render(); break;
      }
      case 'expandAll': App.cardsOpen = true; App.cardOpen = {}; salvaCards(); render(); break;
      case 'collapseAll': App.cardsOpen = false; App.cardOpen = {}; salvaCards(); render(); break;
      case 'cancelSnapEdit': App.editSnap = null; render(); break;
      case 'snapBtn': {
        try {
          const cx = document.getElementById('qualNote');
          const obs = cx ? cx.value.trim() : '';
          /* editando: grava na data original, sobrescrevendo aquela avaliação */
          const quando = App.editSnap ? App.editSnap.date : today();
          const row = await App.db.upsertAssessment(App.cur.id, quando, Object.assign({}, App.cur.scores), obs);
          App.qualNote = obs;
          App.curAssess = App.curAssess.filter(s => s.date !== row.date).concat(row)
            .sort((a, b2) => a.date.localeCompare(b2.date));
          App.allAssess = App.allAssess.filter(s => !(s.goalkeeper_id === row.goalkeeper_id && s.date === row.date)).concat(row);
          toast(App.editSnap
            ? t('editSnapDone').replace('{d}', fmtDate(App.editSnap.date))
            : t('snapshotDone'));
          App.editSnap = null;
          render();
        } catch (err) { toast(err.message); }
        break;
      }
    }
  });

  document.addEventListener('change', e => {
    if (e.target.id !== 'photoInput') return;
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 620, sc = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', 0.82);
        App.cur.photo = data; queueSave({ photo: data }); render();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
    e.target.value = '';
  });

  /* =============================================================
     INICIALIZAÇÃO
     ============================================================= */
  /* ---------------------------------------------------------------
     O módulo não autentica nem escolhe idioma: recebe tudo do hub
     pelo handshake FLUXGK_CONTEXT e só então liga a tela.
     --------------------------------------------------------------- */
  /* O escudo do hub pode ser SVG, e o PDF só embute PNG ou JPEG.
     Converte uma vez, no início, e o relatório usa a versão em PNG. */
  function crestToPng(src) {
    return new Promise(res => {
      if (!src) return res(null);
      if (/^data:image\/(png|jpeg|jpg)/i.test(src)) return res(src);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const S = 512;
          const w = img.naturalWidth || S, h = img.naturalHeight || S;
          const sc = Math.min(S / w, S / h);
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * sc));
          c.height = Math.max(1, Math.round(h * sc));
          const g = c.getContext('2d');
          g.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/png'));
        } catch (e) { res(null); }
      };
      img.onerror = () => res(null);
      img.src = src;
    });
  }

  async function bootFromHub(ctx) {
    App.lang = (ctx.lang === 'pt' || ctx.lang === 'en') ? ctx.lang : 'pt';
    App.theme = 'light';
    App.seasonLabel = (ctx.season && ctx.season.label) || '';
    App.db = FluxAdapter;
    App.user = { id: ctx.uid, email: '' };

    const c = ctx.club || {}, co = ctx.coach || {};
    App.brand = {
      club_name: c.name || 'FluxGK',
      crest: c.badge || null,
      colors: (c.color && ColorKit.isHex(c.color)) ? [ColorKit.norm(c.color)] : [],
      use_in_charts: true,
      resp_name: co.name || '',
      resp_role: co.methodology || ''
    };
    window.FLUX_BRAND = App.brand;
    applyBrand();

    crestToPng(c.badge).then(png => {
      if (!png || png === App.brand.crest) return;
      App.brand.crest = png;
      window.FLUX_BRAND = App.brand;
      applyBrand();
      if (App.view) render();
    });

    shell();
    $('#app').innerHTML = `<div class="empty">${esc(t('loading'))}</div>`;

    await FDB.init(ctx.cloudConfig, ctx.uid, ctx.dataPath);

    const cache = FluxAdapter.cache;
    let first = true;
    const refresh = async () => {
      App.gks = await App.db.listGoalkeepers();
      App.allAssess = await App.db.listAssessments(null);
      if (App.cur) {
        const again = App.gks.find(g => g.id === App.cur.id);
        if (again) App.cur = again;
        App.curAssess = App.allAssess.filter(a => a.goalkeeper_id === App.cur.id)
          .sort((a, b) => a.date.localeCompare(b.date));
        App.curLogs = await App.db.listLogs(App.cur.id);
      }
      if (first) { first = false; App.view = 'squad'; }
      render();
    };

    FDB.onRoster(r => { cache.roster = r; refresh(); });
    FDB.onProfiles(p => { cache.profiles = p; refresh(); });
    FDB.onAssessments(a => { cache.assessments = a; refresh(); });
    FDB.onLogs(l => { cache.logs = l; refresh(); });
    FDB.onCriteria(m2 => {
      cache.model = m2;
      App.model = ModelKit.normalize(m2 || ModelKit.factory());
      if (!m2) App.db.saveModel(App.model);
      render();
    });

    setTimeout(async () => { if (await fixOutOfRange()) render(); }, 1500);
  }
  window.bootFromHub = bootFromHub;
})();


</script>

<script>
/* =============================================================
   HANDSHAKE COM O HUB
   O módulo não faz nada até o hub mandar o contexto. É o mesmo
   protocolo do planner: avisa que está pronto e espera.
   ============================================================= */
(function () {
  var booted = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'FLUXGK_CONTEXT') return;
    if (window.parent !== window && e.source !== window.parent) return;
    if (!d.uid || !d.dataPath || !d.cloudConfig) {
      console.error('[FluxGK] perfil: contexto incompleto', d);
      var el = document.getElementById('app');
      if (el) el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#737373">'
        + 'Abra este módulo pelo hub, com um clube e uma temporada ativos.</div>';
      return;
    }
    if (booted) return;
    booted = true;
    if (d.club && d.club.color) {
      document.documentElement.style.setProperty('--club-color', d.club.color);
    }
    /* o handshake fica no fim do arquivo, então bootFromHub já existe;
       a espera curta cobre o caso de o hub responder antes do parse. */
    (function tick(n) {
      if (window.bootFromHub) return window.bootFromHub(d);
      if (n < 60) setTimeout(function () { tick(n + 1); }, 50);
      else console.error('[FluxGK] perfil: aplicação não carregou.');
    })(0);
  });
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'FLUXGK_MODULE_READY', module: 'profile' }, '*');
    }
  } catch (e) { }
})();
</script>
