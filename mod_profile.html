<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GK Profile · FluxGK</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
/* =============================================================
   Tokens do FluxGK. Os mesmos nomes dos outros módulos, para que
   o módulo se pareça com o resto do hub sem gambiarra de CSS.
   --club-color é alimentada pelo contexto que o hub envia.
   ============================================================= */
:root{
  --ink:#0A0A0A; --paper:#FAFAF7; --mute:#737373; --faint:#E5E5E5;
  --sur:#fff; --bdr:#E5E5E5; --ok:#16A34A; --cau:#D97706; --risk:#DC2626;
  --club-color:#0A0A0A;

  /* nomes usados pelas telas herdadas, mapeados nos tokens acima */
  --surface-1:var(--sur); --plane:var(--paper); --card:var(--sur);
  --text-primary:var(--ink); --text-secondary:#3d3d3a; --muted:var(--mute);
  --grid:var(--faint); --axis:#c9c9c4;
  --border:var(--bdr); --border-strong:#cfcfc9;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
  --good:var(--ok); --warn:var(--cau); --crit:var(--risk); --good-text:#15803d;
  --accent:var(--club-color); --accent-soft:rgba(10,10,10,.07);
  --shadow:0 1px 2px rgba(10,10,10,.04), 0 8px 24px -14px rgba(10,10,10,.16);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Space Grotesk',sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- barra do módulo ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 90px}
.topbar{position:sticky;top:0;z-index:40;background:var(--sur);border-bottom:1px solid var(--bdr)}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.crest{width:30px;height:30px;border-radius:8px;flex:none;background:var(--club-color);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.crest.has-img{background:none;padding:0;overflow:hidden;border-radius:7px}
.crest.has-img img{width:100%;height:100%;object-fit:contain;display:block}
.brand-t{font-weight:600;font-size:14px;white-space:nowrap}
.brand-s{font-size:11.5px;color:var(--mute)}
.nav{display:flex;gap:2px;margin-left:14px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;
  font-size:13px;font-weight:500;color:var(--mute)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--club-color)}
.nav button:hover{color:var(--ink)}
.spacer{margin-left:auto}

.btn{border:1px solid var(--bdr);background:var(--sur);border-radius:9px;padding:6px 11px;
  font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:.14s border-color,.14s background}
.btn:hover{border-color:#c9c9c4}
.btn.primary{background:var(--club-color);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.danger{color:var(--risk)}
.btn.danger:hover{border-color:var(--risk)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--bdr);border-radius:9px;overflow:hidden;background:var(--sur)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--club-color)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--sur);border:1px solid var(--bdr);
  border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px;z-index:60;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--accent-soft);color:var(--club-color)}

.savebadge{font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:5px;min-width:64px}
.savebadge i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.savebadge[data-s="saving"] i{background:var(--cau)}
.savebadge[data-s="error"] i{background:var(--risk)}
.banner{background:#FEF3C7;border-bottom:1px solid #FDE68A;padding:8px 20px;font-size:12.5px;
  display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;color:#78350F}

/* ---------- campos ---------- */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card > h3, h3.ttl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);
  margin-bottom:14px;font-weight:600}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 18px}
.page-head h2{font-size:22px;letter-spacing:-.02em;font-weight:600}
.hint{font-size:11.5px;color:var(--mute);line-height:1.55}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:500;color:var(--mute)}
.field-label{font-size:11.5px;font-weight:500;color:var(--mute);display:block;margin-bottom:8px}
.inp{border:1px solid var(--bdr);background:var(--paper);border-radius:8px;padding:8px 10px;
  font-size:14px;width:100%;font-family:inherit;transition:.14s border-color,.14s box-shadow}
.inp:focus{outline:0;border-color:var(--club-color);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.locked{background:var(--faint);color:var(--mute);cursor:default;
  display:flex;align-items:center;min-height:38px}
textarea.inp{resize:vertical;min-height:66px;line-height:1.55}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.linkish{background:none;border:0;color:var(--club-color);font-size:12.5px;font-weight:500;
  text-decoration:underline;padding:4px}
</style>
<style id="fluxShared">
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- topo ---------- */
.nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:580;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav button:hover{color:var(--text-primary)}
.btn{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 11px;
  font-size:12.5px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:.14s border-color,.14s background}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.savebadge{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;min-width:64px}
.savebadge i{width:7px;height:7px;border-radius:50%;background:var(--good);display:block}
.savebadge[data-s="saving"] i{background:var(--warn)}
.savebadge[data-s="error"] i{background:var(--crit)}

/* ---------- avisos ---------- */
.banner{background:var(--accent-soft);border-bottom:1px solid var(--border);
  padding:7px 20px;font-size:12.5px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.banner b{font-weight:640}

/* ---------- cards ---------- */
.card > h3, h3.ttl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin-bottom:14px;font-weight:640}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 18px}
.page-head h2{font-size:21px;letter-spacing:-.02em}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field label{font-size:11.5px;font-weight:600;color:var(--muted)}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.55}

/* ---------- elenco ---------- */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.gk-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:.14s border-color,.14s transform}
.gk-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
/* A foto e uma janela de proporcao fixa: a imagem preenche e o excedente e
   recortado. Antes a imagem vazava da caixa e a faixa do nome caia no meio
   do rosto. */
.gk-photo{aspect-ratio:3/4;background:var(--surface-1);position:relative;overflow:hidden;
  display:grid;place-items:center;cursor:pointer}
.gk-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 12%;display:block}
.gk-photo .ph{color:var(--muted);font-size:11.5px}
/* nome e idade dentro do card, sobre a foto */
.gk-over{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;cursor:pointer;
  display:flex;align-items:flex-end;gap:8px;
  background:linear-gradient(to top,rgba(8,8,8,.88) 0%,rgba(8,8,8,.62) 40%,rgba(8,8,8,0) 100%);
  color:#fff}
.gk-over .n{font-size:14.5px;font-weight:680;line-height:1.2;letter-spacing:-.01em;
  text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk-over .m{font-size:11px;color:rgba(255,255,255,.82);margin-top:2px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* seta que abre e recolhe o card */
.gk-chev{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.14);color:#fff;font-size:11px;line-height:1;cursor:pointer;
  display:grid;place-items:center;backdrop-filter:blur(4px);transition:.12s background,.12s border-color}
.gk-chev:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5)}
.gk-num{position:absolute;top:9px;left:9px;background:rgba(11,11,11,.72);color:#fff;
  border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:660;backdrop-filter:blur(4px)}
.gk-body{padding:12px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.gk-name{font-size:15px;font-weight:660;letter-spacing:-.01em;cursor:pointer;line-height:1.25}
.gk-name:hover{color:var(--accent)}
.gk-meta{font-size:11.5px;color:var(--muted)}
.gk-scores{display:flex;gap:6px;margin-top:auto}
.mini{flex:1;min-width:0;border:1px solid var(--border);border-radius:7px;padding:5px 4px;text-align:center;background:var(--surface-1);cursor:help}
.mini b{display:block;font-size:14px;font-variant-numeric:tabular-nums;font-weight:660}
[hidden]{display:none!important}
.mini span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.gk-actions{display:flex;gap:6px;padding:0 13px 12px}
.gk-actions .btn{flex:1;justify-content:center}

/* ---------- ficha ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:18px 0 22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:580;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--accent)}
.hero{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.photo-box{flex:none;width:150px}
.photo{width:150px;height:186px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface-1);overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{color:var(--muted);font-size:11.5px;text-align:center;padding:0 10px}
.photo-actions{display:flex;gap:6px;margin-top:8px}
.photo-actions .btn{flex:1;justify-content:center}
.hero-main{flex:1;min-width:240px}
.hero-name{font-size:26px;font-weight:680;letter-spacing:-.02em;line-height:1.15}
.hero-name[data-empty="1"]{color:var(--muted)}
.hero-sub{color:var(--muted);font-size:13px;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface-1);
  display:flex;flex-direction:column;gap:1px;min-width:78px}
.chip b{font-size:15px;font-weight:660;font-variant-numeric:tabular-nums}
.chip span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.scale-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary)}
.scale-legend div{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.axis-head{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.axis-title{font-size:15px;font-weight:660;display:flex;align-items:center;gap:8px}
.axis-bar{width:4px;height:15px;border-radius:2px;flex:none}
.axis-avg{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.axis-avg b{font-size:19px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.crit-row{display:grid;grid-template-columns:1fr 190px 34px;gap:12px;align-items:center;
  padding:9px 0;border-top:1px solid var(--grid)}
.crit-row:first-of-type{border-top:0}
.crit-name{font-size:13.5px}
.crit-note{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
.slider-cell{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:18px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--grid)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--grid)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--sc,var(--series-1));border:2px solid var(--card);
  box-shadow:0 0 0 1px var(--border-strong);margin-top:-5.5px;cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--sc,var(--series-1));
  border:2px solid var(--card);box-shadow:0 0 0 1px var(--border-strong);cursor:pointer}
input[type=range]:focus{outline:0}
.score{width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:660;font-size:14px;
  padding:2px 0;border-radius:6px;background:var(--surface-1);border:1px solid var(--border)}
.score[data-zero="1"]{color:var(--muted);font-weight:500}
.note-btn{border:1px solid var(--border);background:transparent;border-radius:6px;width:26px;height:26px;
  display:grid;place-items:center;color:var(--muted);font-size:13px}
.note-btn:hover,.note-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.note-wrap{padding:0 0 10px}
.lrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.lrow .inp{flex:1}
.lrow .xbtn[disabled]{opacity:.28;cursor:default}
.lrow .xbtn[disabled]:hover{color:var(--muted);border-color:transparent}
.lbullet{width:6px;height:6px;border-radius:2px;margin-top:14px;flex:none}
.xbtn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;
  width:28px;height:32px;flex:none;font-size:15px;line-height:1}
.xbtn:hover{color:var(--crit);border-color:var(--border)}
.entry{border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;background:var(--surface-1)}
.entry-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;background:var(--card)}
.status-pill .dot{border-radius:50%}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 14px;
  border:1px dashed var(--border);border-radius:var(--r);line-height:1.6}

/* ---------- gráficos ---------- */
.chart-wrap{position:relative}
svg.chart{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:2px 0 14px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:block;flex:none}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,0);
  background:var(--card);border:1px solid var(--border-strong);border-radius:8px;padding:8px 11px;
  font-size:12px;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .1s;z-index:10;min-width:140px}
.tip-head{font-weight:660;margin-bottom:5px}
.tip-row{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip-row i{width:9px;height:9px;border-radius:3px;display:block;flex:none}
.tip-row b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:14px}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.dt th,table.dt td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
table.dt th:first-child,table.dt td:first-child{text-align:left;font-variant-numeric:normal}
table.dt th{color:var(--muted);font-weight:620;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
table.dt tr.grp td{padding-top:14px;border-bottom:0}
.delta-up{color:var(--good-text);font-weight:620}
.delta-dn{color:var(--crit);font-weight:620}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:middle}

/* ---------- seleção de goleiros ---------- */
.pickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{border:1px solid var(--border);background:var(--surface-1);border-radius:99px;
  padding:5px 12px 5px 6px;font-size:12.5px;font-weight:560;display:inline-flex;align-items:center;gap:8px}
.pick:hover{border-color:var(--border-strong)}
.pick[aria-pressed="true"]{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.pick .av{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--grid);flex:none;
  display:grid;place-items:center;font-size:10px;font-weight:680;color:var(--muted);overflow:hidden}
.pick .av img{width:100%;height:100%;object-fit:cover}
.pick .sw{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- telas de acesso ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:30px 28px;box-shadow:var(--shadow)}
.gate-card .crest{width:40px;height:40px;font-size:13px;border-radius:11px;margin-bottom:16px}
.gate-card h1{font-size:19px;margin-bottom:5px}
.gate-card p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;line-height:1.6}
.gate-card .field{margin-bottom:12px}
.gate-card .btn{width:100%;justify-content:center;padding:9px}
.err{color:var(--crit);font-size:12.5px;margin-top:10px;min-height:18px}
.gate-alt{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--text-primary);color:var(--plane);padding:9px 16px;border-radius:99px;
  font-size:13px;font-weight:560;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:80;padding:20px}
.modal{background:var(--card);border-radius:12px;padding:22px 24px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.modal h3{font-size:15px;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---------- impressão ---------- */
@media print{
  :root, :root[data-theme="dark"]{
    color-scheme:light;
    --surface-1:#fff; --plane:#fff; --card:#fff;
    --text-primary:#111; --text-secondary:#333; --muted:#666;
    --grid:#e3e3e0; --axis:#b9b9b3; --border:#dcdcd8; --border-strong:#c4c4bf;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
    --good:#0ca30c; --warn:#c98500; --crit:#d03b3b; --good-text:#006300;
    --accent:#2a78d6; --shadow:none;
  }
  @page{margin:12mm}
  .topbar,.tabs,.no-print,.photo-actions,.xbtn,.note-btn,.banner,.gk-actions{display:none!important}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:100%;padding:0}
  .card{break-inside:avoid;page-break-inside:avoid;border:1px solid #e0e0dc;margin-bottom:9px;padding:11px 13px}
  .panel + .panel{break-before:page;page-break-before:always}
  .print-head{display:flex!important;align-items:center;gap:10px;border-bottom:1.5px solid #111;
    padding-bottom:7px;margin-bottom:12px}
  .print-head .crest{width:24px;height:24px;font-size:10px}
  .print-head b{font-size:13pt}
  .print-head span{margin-left:auto;font-size:9pt;color:#666}
  .panel-title{display:block!important;font-size:12pt;font-weight:680;margin:0 0 9px}
  .static-val{font-size:10.5pt;border-bottom:1px solid #eceae5;padding:1px 0 3px;min-height:1.5em;
    white-space:pre-wrap;line-height:1.45}
  .static-val.blank{color:#bdbdb8}
  .static-val.multi{border:0;border-left:2px solid #eceae5;padding-left:8px}
  .status-pill .static-val{border:0;padding:0;min-height:0;font-weight:600;font-size:9.5pt}
  .lrow .static-val{flex:1}
  input[type=range]{display:none}
  .crit-row{grid-template-columns:1fr 34px;padding:5px 0}
  .slider-cell{justify-content:flex-end}
  .score{border:0;background:transparent;font-size:11pt}
  .entry{break-inside:avoid;page-break-inside:avoid}
  .empty{display:none}
}

/* ---------- escudo com imagem ---------- */
.crest.has-img{background:none;padding:0;overflow:hidden;border-radius:7px}
.crest.has-img img{width:100%;height:100%;object-fit:contain;display:block}
.gate-card .crest.has-img{width:52px;height:52px}

/* ---------- menu do topo ---------- */
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:6px;
  font-size:13px;font-weight:520;white-space:nowrap}
.menu button:hover{background:var(--accent-soft);color:var(--accent)}

/* ---------- identidade visual ---------- */
.brand-edit{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.crest-preview{width:150px;height:150px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface-1);display:grid;place-items:center;overflow:hidden}
.crest-preview img{width:100%;height:100%;object-fit:contain;padding:12px}
.crest-preview span{color:var(--muted);font-size:12px}
.color-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.color-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:8px;padding:4px 5px 4px 6px;background:var(--surface-1)}
.color-chip input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;border-radius:6px}
.color-chip input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-chip input[type=color]::-webkit-color-swatch{border:1px solid var(--border);border-radius:5px}
.color-chip code{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-secondary)}
.color-chip .xbtn{width:22px;height:22px;font-size:13px}
.brand-prev{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface-1)}
.prev-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.prev-bar b{font-size:14px}
.prev-nav{font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:7px;font-weight:560}
.prev-btn{font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px}

.legibility{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--good);
  border-radius:9px;padding:12px 14px;background:var(--surface-1)}
.legibility[data-level="warn"]{border-left-color:var(--warn)}
.legibility[data-level="bad"]{border-left-color:var(--crit)}
.leg-head{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.leg-head i{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.legibility[data-level="warn"] .leg-head i{background:var(--warn)}
.legibility[data-level="bad"] .leg-head i{background:var(--crit)}
.leg-head span{color:var(--muted);margin-left:auto;font-size:11.5px}
.legibility p{margin:0;font-size:12.5px;color:var(--text-secondary);line-height:1.55}
.legibility p.leg-extra{margin-top:6px;color:var(--muted);font-size:11.5px}
.swatches{display:flex;gap:5px;margin-top:10px}
.sw-box{width:26px;height:12px;border-radius:3px;display:block}

/* ---------- relatórios ---------- */
.rp-types{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:700px){.rp-types{grid-template-columns:1fr}}
.rp-type{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;background:var(--surface-1);cursor:pointer;transition:.14s border-color,.14s background}
.rp-type:hover{border-color:var(--border-strong)}
.rp-type.on{border-color:var(--accent);background:var(--accent-soft)}
.rp-type input{margin-top:2px;flex:none}
/* blocos do relatorio individual */
.rp-secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rp-sec{display:flex;gap:9px;align-items:center;border:1px solid var(--border);border-radius:var(--r);
  padding:9px 11px;background:var(--surface-1);cursor:pointer;font-size:12.5px;
  transition:.14s border-color,.14s background}
.rp-sec:hover{border-color:var(--border-strong)}
.rp-sec.on{border-color:var(--accent);background:var(--accent-soft)}
.rp-sec input{flex:none}
.rp-type b{display:block;font-size:13.5px;font-weight:640;margin-bottom:3px}
.rp-type span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5}
.rp-files{display:flex;flex-direction:column;gap:7px}
.rp-file{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;background:var(--surface-1);text-align:left;transition:.14s border-color}
.rp-file:hover{border-color:var(--accent)}
.rp-ic{font-size:9.5px;font-weight:700;letter-spacing:.04em;background:var(--crit);color:#fff;
  padding:3px 6px;border-radius:4px;flex:none}
.rp-nm{flex:1;font-size:12.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-sz{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* ---------- parâmetros de avaliação ---------- */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bulkbox textarea{width:100%;font-family:inherit;font-size:13px;line-height:1.5;padding:9px 10px;resize:vertical}
@media(max-width:760px){.tri{grid-template-columns:1fr}}
.tri-f{display:flex;align-items:center;gap:7px;min-width:0}
.tri-f span{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;
  background:var(--surface-1);border:1px solid var(--border);border-radius:5px;padding:3px 5px;flex:none}
.tri-f .inp{padding:6px 8px;font-size:13px}
.axis-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--grid)}
.axis-card-head b{font-size:15px}
.lvl-row{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.lvl-n{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
  color:#fff;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.lvl-row .tri{flex:1;min-width:0}
.item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--grid)}
.item-row:first-of-type{border-top:0}
.item-n{width:22px;text-align:right;font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.item-row .tri{flex:1;min-width:0}
.item-actions{display:flex;gap:2px;flex:none}
.item-actions .xbtn{width:24px;height:26px;font-size:12px}
.item-actions .xbtn:disabled{opacity:.25;cursor:default}
.item-actions .xbtn:disabled:hover{color:var(--muted);border-color:transparent}
.scale-legend b{font-variant-numeric:tabular-nums;color:var(--text-primary)}

.scope-note{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:9px;padding:11px 13px;background:var(--surface-1)}
.scope-note b{font-size:22px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1;flex:none}
.scope-note span{font-size:12px;color:var(--text-secondary);line-height:1.55}
