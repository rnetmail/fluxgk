<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FluxGK · Scouting</title>
<script src="fluxgk-i18n.js"></script>
<script src="/static/fluxgk-ditado.js"></script>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
:root{
  --ink:#0a0a0a; --paper:#fafaf7; --surface:#fff; --surface2:#f4f4f1;
  --border:#e5e5e5; --border2:#d4d4d4; --mute:#737373;
  --accent:#00a8e8; --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
.nav{--nav-bg:var(--ink);--nav-fg:255,255,255;
  background:var(--nav-bg);color:rgb(var(--nav-fg));padding:0 24px;height:54px;display:flex;align-items:center;gap:26px;position:sticky;top:0;z-index:50}
.nav .wm{font-weight:700;font-size:18px;letter-spacing:-.04em}
.nav .wm span{color:rgba(var(--nav-fg),.62)}
.nav .sub{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:rgba(var(--nav-fg),.45);text-transform:uppercase}
.ntab{background:none;border:0;color:rgba(var(--nav-fg),.55);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;padding:6px 10px;border-radius:6px;cursor:pointer}
.ntab:hover{color:rgb(var(--nav-fg))}
.ntab.on{background:rgba(var(--nav-fg),.14);color:rgb(var(--nav-fg))}
#navBadge{background:rgba(var(--nav-fg),.14);border-color:rgba(var(--nav-fg),.22)}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
h1{font-size:22px;letter-spacing:-.03em}
h2{font-size:15px;letter-spacing:-.02em;margin-bottom:12px}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.mb14{margin-bottom:14px}.mb20{margin-bottom:20px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
label.f{display:block}
label.f>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);
  border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 15px;border-radius:7px;border:1px solid var(--border2);
  background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dg{color:var(--red);border-color:#f3c4c4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gk{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 15px;cursor:pointer;transition:.12s}
.gk:hover{border-color:var(--ink);transform:translateY(-1px)}
.gkfoto{width:46px;height:46px;border-radius:9px;flex:none;object-fit:cover;background:var(--surface2);
  border:1px solid var(--border);display:block}
.gkini{width:46px;height:46px;border-radius:9px;flex:none;background:var(--surface2);border:1px solid var(--border);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--mute)}
.fotobox{width:104px;height:104px;border-radius:12px;border:1px dashed var(--border2);background:var(--surface2);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;text-align:center}
.fotobox:hover{border-color:var(--ink)}
.fotobox img{width:100%;height:100%;object-fit:cover}
.fotobox .ph{font-size:11px;color:var(--mute);padding:8px;line-height:1.4}
.gk .nm{font-weight:700;font-size:15px;letter-spacing:-.02em}
.gk .cl{font-size:12px;color:var(--mute);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;
  border-radius:5px;background:var(--surface2);color:var(--mute);border:1px solid var(--border)}
.tag.a{background:#fff4e5;color:var(--amber);border-color:#f5dcb8}
.tag.hi{background:#fee;color:var(--red);border-color:#f3c4c4}
.tag.pend{background:#eef6ff;color:#185fa5;border-color:#c3ddf7}
.tag.sel{background:#e9f7ee;color:var(--green);border-color:#bfe4cd}
.empty{text-align:center;padding:52px 20px;color:var(--mute)}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.areahead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.areahead b{font-size:14px}
.nota{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--border)}
.n1,.n2{background:#fee;color:var(--red);border-color:#f3c4c4}
.n3{background:#fff4e5;color:var(--amber);border-color:#f5dcb8}
.n4,.n5{background:#e9f7ee;color:var(--green);border-color:#bfe4cd}
.quando{font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.04em}
.hist{border-left:2px solid var(--border);padding-left:12px;margin-top:8px}
.hist div{font-size:12.5px;color:var(--mute);margin-bottom:5px;line-height:1.5}
.stars{letter-spacing:2px;cursor:pointer;user-select:none;font-size:17px;color:var(--border2)}
.stars b{color:var(--amber);font-weight:400}
.back{background:none;border:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);cursor:pointer;padding:0;margin-bottom:14px}
.back:hover{color:var(--ink)}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1}
.aviso{background:#fff9e6;border:1px solid #f0dfae;border-radius:9px;padding:11px 14px;font-size:12.5px;color:#7a5b12;line-height:1.55}
</style>
</head>
<body>

<div class="nav" id="nav">
  <div id="navBadge" style="width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);display:none;place-items:center;overflow:hidden;flex:none">
    <img id="navBadgeImg" alt="" style="width:100%;height:100%;object-fit:contain;display:none">
    <span id="navBadgeIni" style="font-size:11px;font-weight:700"></span>
  </div>
  <div>
    <div class="wm">Flux<span>GK</span></div>
    <div class="sub">Scouting</div>
  </div>
  <button class="ntab on" data-p="lista">Goleiros</button>
  <button class="ntab" data-p="mapa">Mapa</button>
  <button class="ntab" data-p="ajustes">Ajustes</button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
    <span id="sync" title="" style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)"></span>
    <span style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.4)" id="contador"></span>
  </div>
</div>
<div id="ctxStrip" style="border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute)">
  <img id="ctxBadge" alt="" style="width:17px;height:17px;object-fit:contain;border-radius:3px;display:none">
  <span><span id="ctx-club">—</span> · <span id="ctx-season">—</span> · <span id="ctx-coach">—</span></span>
  <span style="margin-left:auto;opacity:.8" data-i18n="scout.personal">acervo pessoal, atravessa clubes e temporadas</span>
</div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   FluxGK · Scouting — protótipo isolado
   Ainda NÃO faz parte do sistema: não fala com o hub nem com o
   PocketBase. Guarda tudo no navegador e exporta em JSON, para que a
   integração futura seja só uma importação.
   ══════════════════════════════════════════════════════════════════ */

const AREAS = [
  { k:'defensivas',     nome:'Ações defensivas' },
  { k:'ofensivas',      nome:'Ações ofensivas' },
  { k:'comportamental', nome:'Aspectos comportamentais' },
  { k:'tatica',         nome:'Tática' },
  { k:'adaptabilidade', nome:'Adaptabilidade' }
];
const CHAVE = 'fluxgk_scouting_v1';
let DB = { gks:[], config:{ ligas:[], etiquetas:[], paises:[] } };
let pagina = 'lista', abertoId = null;
let filtros = { q:'', idade:'', pais:'', liga:'', pe:'', altura:'', selecao:'', etiqueta:'', visto:'', prio:'' };

/* ══════════════════════════════════════════════════════════════════
   PERSISTÊNCIA
   Nuvem em users/{uid}/scouting — pessoal, atravessa clubes e
   temporadas, como a biblioteca de exercícios do Planner.
   O navegador guarda uma cópia só para a tela abrir instantânea;
   a fonte de verdade é o PocketBase.
   ══════════════════════════════════════════════════════════════════ */
let _db = null, _uid = null, _pronto = false, _ouvindo = false, _erroNuvem = '';
let _sincTimer = null;

function _dot(cor, titulo){
  const el = document.getElementById('sync');
  if(el){ el.style.background = cor; el.title = titulo || ''; }
}
function _base(){ return 'users/' + _uid + '/scouting'; }

function carregar(){
  try{
    const cru = localStorage.getItem(CHAVE);
    if(cru){ const d = JSON.parse(cru); DB = Object.assign(DB, d); }
  }catch(e){ console.warn('[scouting] cache local ilegível:', e); }
  DB.gks = DB.gks || [];
  DB.config = Object.assign({ ligas:[], etiquetas:[], paises:[] }, DB.config||{});
}

/* grava já no navegador e agenda a subida para a nuvem */
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(DB)); }
  catch(e){ console.warn('[scouting] cache local cheio:', e); }
  agendarSubida();
}
function agendarSubida(){
  if(!_pronto) { _dot('#d97706', 'aguardando conexão'); return; }
  clearTimeout(_sincTimer);
  _sincTimer = setTimeout(subirTudo, 600);
}
let _enviado = Object.create(null);   /* id -> JSON já gravado */
function subirTudo(){
  if(!_pronto) return;
  const upd = {};
  let n = 0;
  DB.gks.forEach(g => {
    const j = JSON.stringify(g);
    if(_enviado[g.id] === j) return;      /* nada mudou nesse goleiro */
    upd['goalkeepers/' + g.id] = g; _enviado[g.id] = j; n++;
  });
  const jc = JSON.stringify(DB.config);
  if(_enviado.__config !== jc){ upd['config'] = DB.config; _enviado.__config = jc; n++; }
  if(!n){ _dot('#16a34a', 'salvo na nuvem'); return; }
  _dot('#d97706', 'gravando…');
  _db.ref(_base()).update(upd)
    .then(()=> _dot('#16a34a', 'salvo na nuvem'))
    .catch(e=>{
      _enviado = Object.create(null);      /* falhou: reenvia tudo na próxima */
      _dot('#dc2626', 'falhou: ' + e.message); console.error('[scouting] gravação:', e);
    });
}
function apagarNaNuvem(id){
  if(!_pronto) return;
  _db.ref(_base() + '/goalkeepers/' + id).remove()
    .catch(e=>{ _dot('#dc2626', 'falhou'); console.error('[scouting] remoção:', e); });
}

/* ---------- handshake com o hub ---------- */
const SDK = [
  '/static/vendor/pocketbase.umd.js',
  '/static/pocketbase-adapter.js'
];
function carregaSDK(src){
  return new Promise((ok, err)=>{
    if(document.querySelector('script[src="'+src+'"]')) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>ok(); s.onerror = ()=>err(new Error('SDK: '+src));
    document.head.appendChild(s);
  });
}
window.addEventListener('message', async e=>{
  const d = e.data;
  if(!d || d.type !== 'FLUXGK_CONTEXT') return;
  if(window.parent !== window && e.source !== window.parent) return;
  if(!d.uid || !d.cloudConfig){ console.error('[scouting] contexto incompleto', d); return; }
  if(d.lang) try{ FluxGKI18n.setLang(d.lang, false); }catch(err){}
  _uid = d.uid;
  aplicarIdentidade(d);
  if(_pronto) return;
  try{
    if(!window.fluxdb){ for(const s of SDK) await carregaSDK(s); }
    if(!fluxdb.apps.length) fluxdb.initializeApp(d.cloudConfig);
    _db = fluxdb.database();
    fluxdb.auth().onAuthStateChanged(u=>{
      if(!u){ console.error('[scouting] sem sessão — entre pelo hub.'); _dot('#dc2626','sem sessão'); return; }
      _pronto = true;
      console.log('[scouting] autenticado como', u.uid);
      ligarListener();
      agendarSubida();
    });
  }catch(err){
    console.error('[scouting] PocketBase:', err);
    _dot('#dc2626', err.message);
  }
});
try{ if(window.parent && window.parent !== window) window.parent.postMessage({type:'FLUXGK_MODULE_READY',module:'scouting'},'*'); }catch(e){}

/* ---------- identidade visual vinda do hub ----------
   O acervo é pessoal e atravessa clubes, mas enquanto você trabalha o módulo
   veste o clube ativo: cor na barra, escudo e a faixa de contexto. */
function _hexOk(c){ return typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c.trim()); }
function _lum(h){
  h = h.replace('#',''); if(h.length === 3) h = h.split('').map(x=>x+x).join('');
  const f = i => { const c = parseInt(h.substr(i,2),16)/255; return c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  return .2126*f(0) + .7152*f(2) + .0722*f(4);
}
/* contraste com o branco: abaixo de 2 a barra é clara demais e o texto some */
function _claroDemais(cor){
  const L = _lum(cor);
  return (1.05) / (L + .05) < 2.0;
}
function aplicarIdentidade(d){
  const c = d.club || {}, se = d.season || {}, co = d.coach || {};
  const cor = _hexOk(c.color) ? c.color.trim() : null;

  if(cor){
    document.documentElement.style.setProperty('--accent', cor);
    const nav = document.getElementById('nav');
    if(nav){
      nav.style.setProperty('--nav-bg', cor);
      /* clube de cor clara: inverte a tinta para o texto não sumir na barra */
      nav.style.setProperty('--nav-fg', _claroDemais(cor) ? '10,10,10' : '255,255,255');
    }
    const strip = document.getElementById('ctxStrip');
    if(strip) strip.style.background = cor + '14';   /* 8% da cor do clube */
  }

  /* escudo: na barra e na faixa */
  const cx = document.getElementById('navBadge');
  const img = document.getElementById('navBadgeImg');
  const ini = document.getElementById('navBadgeIni');
  const sigla = ((c.abbr || c.name || 'GK') + '').slice(0,2).toUpperCase();
  if(cx){
    cx.style.display = 'grid';
    if(c.badge){ img.src = c.badge; img.style.display = 'block'; ini.style.display = 'none'; }
    else { img.style.display = 'none'; ini.style.display = 'block'; ini.textContent = sigla; }
  }
  const cb = document.getElementById('ctxBadge');
  if(cb){
    if(c.badge){ cb.src = c.badge; cb.style.display = 'block'; }
    else cb.style.display = 'none';
  }

  const set = (id,v)=>{ const el = document.getElementById(id); if(el) el.textContent = v || '—'; };
  set('ctx-club', c.name);
  set('ctx-season', se.label);
  set('ctx-coach', co.name);
}

/* O listener só sobe DEPOIS do login: ligado antes, as regras negam a
   leitura, o PocketBase cancela a inscrição em silêncio e ela nunca volta. */
function ligarListener(){
  if(_ouvindo || !_db || !_uid) return;
  _ouvindo = true;
  _db.ref(_base()).on('value', snap=>{
    const d = snap.val();
    _erroNuvem = '';
    if(d){
      DB.gks = d.goalkeepers ? Object.values(d.goalkeepers).filter(x=>x && x.id) : [];
      DB.config = Object.assign({ ligas:[], etiquetas:[], paises:[] }, d.config||{});
      try{ localStorage.setItem(CHAVE, JSON.stringify(DB)); }catch(e){}
      _dot('#16a34a', 'sincronizado');
      console.log('[scouting] goleiros carregados:', DB.gks.length);
    } else {
      /* nuvem vazia: se houver algo digitado no protótipo, oferece subir */
      console.log('[scouting] nuvem vazia');
      _dot('#16a34a', 'sincronizado');
      if(DB.gks.length) subirTudo();
    }
    render();
  }, err=>{
    _ouvindo = false;
    _erroNuvem = (err && err.message) || String(err);
    console.error('[scouting] leitura negada:', err);
    _dot('#dc2626', _erroNuvem);
    render();
  });
}

/* ---------- utilidades ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje = () => new Date().toISOString().slice(0,10);
const uid  = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function fd(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T12:00');
  return isNaN(d) ? iso : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove('on'), 2600);
}
/* busca sem acento e sem diferença de maiúsculas */
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* iniciais para quando não há foto — duas letras, como no escudo do hub */
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return 'GK';
  if(p.length === 1) return p[0].slice(0,2).toUpperCase();
  return (p[0][0] + p[p.length-1][0]).toUpperCase();
}
/* A foto é só para reconhecer o rosto num cartão de 46px, então é reduzida
   com força antes de guardar: uma foto de celular tem vários MB e o banco
   inteiro do sistema hoje usa ~21 MB. Aqui cada uma fica em poucos KB. */
function encolherFoto(dataUrl, lado, q){
  return new Promise(ok=>{
    const img = new Image();
    img.onload = ()=>{
      const L = lado || 240;
      const e = Math.min(L / img.width, L / img.height, 1);
      const w = Math.max(1, Math.round(img.width * e)), h = Math.max(1, Math.round(img.height * e));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ ok(c.toDataURL('image/jpeg', q || 0.72)); }catch(e2){ ok(dataUrl); }
    };
    img.onerror = ()=> ok(dataUrl);
    img.src = dataUrl;
  });
}
function idade(g){
  if(!g.anoNasc) return null;
  return new Date().getFullYear() - Number(g.anoNasc);
}
function faixaIdade(g){
  const i = idade(g);
  if(i == null) return '';
  return i <= 25 ? 'ate25' : i <= 30 ? 'ate30' : 'mais30';
}
const ROTULO_FAIXA = { ate25:'até 25', ate30:'até 30', mais30:'+30' };

/* valor atual de uma área: a atualização mais recente que a tocou,
   ou a leitura inicial se nenhuma tocou */
function areaAtual(g, k){
  let melhor = null;
  const li = g.leitura && g.leitura[k];
  if(li && (String(li.texto||'').trim() || li.nota)) melhor = { nota:li.nota, texto:li.texto, data:g.leitura.data, origem:'inicial' };
  (g.atualizacoes||[]).forEach(u=>{
    const a = u.areas && u.areas[k];
    if(!a || (!String(a.texto||'').trim() && !a.nota)) return;
    if(!melhor || String(u.data||'') >= String(melhor.data||'')) melhor = { nota:a.nota, texto:a.texto, data:u.data, origem:'atualizacao', adversario:u.adversario };
  });
  return melhor;
}
function historicoArea(g, k){
  const out = [];
  const li = g.leitura && g.leitura[k];
  if(li && (String(li.texto||'').trim() || li.nota)) out.push({ nota:li.nota, texto:li.texto, data:g.leitura.data, adversario:g.leitura.adversario });
  (g.atualizacoes||[]).forEach(u=>{
    const a = u.areas && u.areas[k];
    if(a && (String(a.texto||'').trim() || a.nota)) out.push({ nota:a.nota, texto:a.texto, data:u.data, adversario:u.adversario });
  });
  return out.sort((x,y)=> String(y.data||'').localeCompare(String(x.data||'')));
}
function vistoEm(g){
  let d = (g.leitura && g.leitura.data) || '';
  (g.atualizacoes||[]).forEach(u=>{ if(String(u.data||'') > d) d = u.data; });
  return d || '';
}
function mesesDesde(iso){
  if(!iso) return 9999;
  const d = new Date(iso + 'T12:00');
  if(isNaN(d)) return 9999;
  return (Date.now() - d.getTime()) / (1000*60*60*24*30.4);
}
/* um goleiro está "pendente" enquanto a leitura inicial não foi feita */
function pendente(g){
  if(!g.leitura) return true;
  return !AREAS.some(a => { const x = g.leitura[a.k]; return x && (String(x.texto||'').trim() || x.nota); });
}

/* listas que alimentam os filtros: o que o treinador digitou + o que já existe nas fichas */
function opcoes(campo){
  const set = new Set((DB.config[campo === 'liga' ? 'ligas' : campo === 'pais' ? 'paises' : 'etiquetas'] || []).filter(Boolean));
  DB.gks.forEach(g=>{
    if(campo === 'liga' && g.liga) set.add(g.liga);
    if(campo === 'pais') (g.nacionalidade||[]).forEach(p=>p&&set.add(p));
    if(campo === 'etiqueta') (g.etiquetas||[]).forEach(t=>t&&set.add(t));
  });
  return [...set].sort((a,b)=>a.localeCompare(b));
}

/* ---------- filtro ---------- */
function filtrados(){
  const q = norm(filtros.q);
  return DB.gks.filter(g=>{
    if(q){
      const alvo = norm([g.nome, g.nomeAlt, g.clube, g.liga, (g.nacionalidade||[]).join(' ')].join(' '));
      if(alvo.indexOf(q) < 0) return false;
    }
    if(filtros.idade   && faixaIdade(g) !== filtros.idade) return false;
    if(filtros.pais    && !(g.nacionalidade||[]).includes(filtros.pais)) return false;
    if(filtros.liga    && g.liga !== filtros.liga) return false;
    if(filtros.pe      && g.pe !== filtros.pe) return false;
    if(filtros.altura  && g.altura !== filtros.altura) return false;
    if(filtros.selecao && String(!!g.selecao) !== filtros.selecao) return false;
    if(filtros.etiqueta&& !(g.etiquetas||[]).includes(filtros.etiqueta)) return false;
    if(filtros.prio    && (g.prioridade||'') !== filtros.prio) return false;
    if(filtros.visto){
      const m = mesesDesde(vistoEm(g));
      if(m > Number(filtros.visto)) return false;
    }
    return true;
  }).sort((a,b)=> String(vistoEm(b)).localeCompare(String(vistoEm(a))));
}

function ligarEventos(){
  const $ = id => document.getElementById(id);

  document.querySelectorAll('.ntab').forEach(b=>{
    b.onclick = ()=>{ pagina = b.dataset.p; abertoId = null; render(); };
  });

  /* --- cadastro relâmpago --- */
  if($('qAdd')){
    const add = ()=>{
      const nome = $('qNome').value.trim();
      if(!nome){ $('qNome').focus(); return; }
      const g = { id:uid(), nome, clube:$('qClube').value.trim(), liga:$('qLiga').value.trim(),
        nacionalidade:[], etiquetas:[], links:[], atualizacoes:[], criadoEm:hoje() };
      DB.gks.unshift(g); salvar(); toast('Anotado. Complete a leitura quando puder.');
      render();
    };
    $('qAdd').onclick = add;
    ['qNome','qClube','qLiga'].forEach(id=>{
      $(id).onkeydown = e => { if(e.key === 'Enter') add(); };
    });
  }

  /* --- filtros --- */
  const liga = (id, campo) => { const el = $(id); if(el) el.onchange = ()=>{ filtros[campo] = el.value; render(); }; };
  if($('fq')) $('fq').oninput = ()=>{ filtros.q = $('fq').value; const p = $('fq').selectionStart; render();
    const n = $('fq'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  liga('fIdade','idade'); liga('fPais','pais'); liga('fLiga','liga'); liga('fPe','pe');
  liga('fAltura','altura'); liga('fSelecao','selecao'); liga('fEtiqueta','etiqueta');
  liga('fVisto','visto'); liga('fPrio','prio');
  if($('fLimpar')) $('fLimpar').onclick = ()=>{ filtros = { q:'', idade:'', pais:'', liga:'', pe:'', altura:'', selecao:'', etiqueta:'', visto:'', prio:'' }; render(); };

  document.querySelectorAll('[data-abrir]').forEach(el=>{
    el.onclick = ()=>{ abertoId = el.dataset.abrir; render(); window.scrollTo({top:0}); };
  });

  /* --- ficha: campos --- */
  if($('voltar')) $('voltar').onclick = ()=>{ abertoId = null; render(); };
  document.querySelectorAll('[data-c]').forEach(el=>{
    el.onchange = ()=>{
      const g = DB.gks.find(x=>x.id===abertoId); if(!g) return;
      const c = el.dataset.c, v = el.value;
      if(c === 'nacionalidade' || c === 'etiquetas') g[c] = v.split(',').map(s=>s.trim()).filter(Boolean);
      else if(c === 'selecao') g.selecao = v === '' ? undefined : v === '1';
      else if(c === 'anoNasc') g.anoNasc = v ? Number(v) : null;
      else if(c === 'links'){
        g.links = v.split('\n').map(l=>{
          const p = l.split('|'); const url = (p[1]||p[0]||'').trim();
          if(!url) return null;
          return { titulo:(p[1] ? p[0] : 'vídeo').trim(), url };
        }).filter(Boolean);
      }
      else g[c] = v;
      salvar();
      if(c === 'links' || c === 'anoNasc') render();
    };
  });
  /* --- foto --- */
  if($('fotoBox')){
    const box = $('fotoBox');
    const usar = arquivo => {
      if(!arquivo || !/^image\//.test(arquivo.type)) return;
      const r = new FileReader();
      r.onload = async ev => {
        const g = DB.gks.find(x=>x.id===abertoId); if(!g) return;
        g.foto = await encolherFoto(ev.target.result, 240, 0.72);
        salvar(); toast('Foto salva.'); render();
      };
      r.readAsDataURL(arquivo);
    };
    box.onclick = ()=> $('fotoFile').click();
    $('fotoFile').onchange = e => usar(e.target.files[0]);
    box.ondragover = e => { e.preventDefault(); box.style.borderColor = 'var(--ink)'; };
    box.ondragleave = ()=> { box.style.borderColor = ''; };
    box.ondrop = e => { e.preventDefault(); box.style.borderColor = ''; usar(e.dataTransfer.files[0]); };
    if($('fotoRm')) $('fotoRm').onclick = e => {
      e.stopPropagation();
      const g = DB.gks.find(x=>x.id===abertoId); if(!g) return;
      delete g.foto; salvar(); render();
    };
  }

  if($('apagar')) $('apagar').onclick = ()=>{
    const g = DB.gks.find(x=>x.id===abertoId);
    if(!g || !confirm('Apagar "' + (g.nome||'') + '" e todas as observações?')) return;
    const morto = abertoId;
    DB.gks = DB.gks.filter(x=>x.id!==morto); salvar(); apagarNaNuvem(morto);
    abertoId = null; toast('Apagado.'); render();
  };

  /* --- observação --- */
  if($('novaObs')) $('novaObs').onclick = ()=>{
    const g = DB.gks.find(x=>x.id===abertoId); if(!g) return;
    $('obsForm').innerHTML = formObs(g);
    ligarEstrelas();
    $('obsCancelar').onclick = ()=>{ $('obsForm').innerHTML = ''; };
    $('obsSalvar').onclick = ()=>{
      const areas = {};
      AREAS.forEach(a=>{
        const t = $('txt_'+a.k).value.trim(), n = $('nota_'+a.k).value;
        if(t || n) areas[a.k] = { texto:t, nota: n ? Number(n) : null };
      });
      if(!Object.keys(areas).length){ toast('Preencha ao menos uma área.'); return; }
      const reg = { data:$('obsData').value || hoje(), adversario:$('obsAdv').value.trim(), areas };
      if(pendente(g)){
        g.leitura = Object.assign({ data:reg.data, adversario:reg.adversario }, areas);
      } else {
        g.atualizacoes = g.atualizacoes || [];
        g.atualizacoes.push(reg);
      }
      salvar(); toast('Leitura registrada.'); render();
    };
  };

  /* --- ajustes --- */
  if($('expJson')) $('expJson').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fluxgk-scouting-' + hoje() + '.json';
    a.click();
  };
  if($('impBtn')) $('impBtn').onclick = ()=> $('impFile').click();
  if($('impFile')) $('impFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try{
        const d = JSON.parse(ev.target.result);
        if(!d || !Array.isArray(d.gks)) throw new Error('arquivo não parece do Scouting');
        if(!confirm('Substituir os ' + DB.gks.length + ' goleiros atuais pelos ' + d.gks.length + ' do arquivo?')) return;
        DB = Object.assign({ gks:[], config:{ ligas:[], etiquetas:[], paises:[] } }, d);
        salvar(); subirTudo(); toast('Importado.'); render();
      }catch(err){ toast('Não consegui importar: ' + err.message); }
    };
    r.readAsText(f);
  };
  if($('cfgSalvar')) $('cfgSalvar').onclick = ()=>{
    const linhas = id => ($(id).value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    DB.config.ligas = linhas('cfgLigas');
    DB.config.etiquetas = linhas('cfgTags');
    DB.config.paises = linhas('cfgPaises');
    salvar(); toast('Listas salvas.'); render();
  };
}

/* estrelas de 1 a 5, clicáveis; clicar de novo na mesma limpa */
function ligarEstrelas(){
  document.querySelectorAll('[data-estrela]').forEach(el=>{
    const k = el.dataset.estrela;
    el.querySelectorAll('[data-n]').forEach(s=>{
      s.onclick = ()=>{
        const alvo = document.getElementById('nota_'+k);
        const n = Number(s.dataset.n);
        alvo.value = (Number(alvo.value) === n) ? '' : String(n);
        const v = Number(alvo.value)||0;
        el.querySelectorAll('[data-n]').forEach(x=>{
          const on = Number(x.dataset.n) <= v;
          x.textContent = on ? '★' : '☆';
          x.style.color = on ? 'var(--amber)' : '';
        });
      };
    });
  });
}

carregar();
render();
</script>
</body>
</html>
