# FluxGK · promoção HML → PRD.
#
# Decisão humana: só roda quando alguém aperta "Run workflow" (Actions → promover). Leva para produção
# exatamente o commit que está em `develop` e passou no CI, numera a versão e conserva o histórico:
#
#   1. confere que o CI do HEAD de develop está verde;
#   2. calcula a próxima versão 1.<ano>.<seq> (seq de 3 dígitos, recomeça em 001 a cada ano) pelas tags;
#   3. grava VERSION em develop, cria a tag e avança `main` por fast-forward (nunca merge, nunca força);
#   4. reimplanta `fluxgk` (PRD) e `fluxgk-hml` pelos webhooks do Portainer;
#   5. espera https://fluxgk.rstecbr.com.br/versao.json mostrar a versão nova.
#
# Voltar de versão: rodar este mesmo workflow não volta; o caminho é `git push origin <tag>:main --force`
# por quem decide, e o webhook de PRD. Banco não volta junto: migration tem de ser compatível com a anterior.
name: promover

on:
  workflow_dispatch:
    inputs:
      notas:
        description: O que esta versão leva (vai na mensagem da tag)
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: promover
  cancel-in-progress: false

jobs:
  prd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prd
      url: https://fluxgk.rstecbr.com.br
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: CI verde no HEAD de develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          R=$(gh run list --workflow ci --branch develop --commit "$SHA" --event push --json conclusion --jq '.[0].conclusion')
          echo "CI de $SHA: ${R:-nenhum}"
          test "$R" = "success" || { echo "::error::o CI de develop ($SHA) não está verde; promova depois que HML passar"; exit 1; }

      - name: Próxima versão
        id: v
        run: |
          ANO=$(TZ=America/Bahia date +%Y)
          ULT=$(git tag -l "1.${ANO}.*" | sort -V | tail -1)
          SEQ=$(( ${ULT:+10#${ULT##*.}} + 1 ))
          V=$(printf '1.%s.%03d' "$ANO" "$SEQ")
          echo "anterior: ${ULT:-nenhuma}  nova: $V"
          echo "versao=$V" >> "$GITHUB_OUTPUT"

      - name: Gravar VERSION, tag e avançar main
        env:
          V: ${{ steps.v.outputs.versao }}
          NOTAS: ${{ inputs.notas }}
        run: |
          git config user.name "fluxgk-release"
          git config user.email "fluxgk-release@users.noreply.github.com"
          echo "$V" > VERSION
          git add VERSION
          git commit -m "release: $V"
          git tag -a "$V" -m "FluxGK $V${NOTAS:+ — $NOTAS}"
          git push origin HEAD:develop
          git push origin "$V"
          git push origin HEAD:main
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reimplantar PRD e HML no Portainer
        env:
          PRD: ${{ secrets.PORTAINER_WEBHOOK_PRD }}
          HML: ${{ secrets.PORTAINER_WEBHOOK_HML }}
        run: |
          test -n "$PRD" || { echo "::error::falta o secret PORTAINER_WEBHOOK_PRD"; exit 1; }
          curl -fsS -X POST "${PRD}"
          if [ -n "$HML" ]; then curl -fsS -X POST "${HML}" || true; fi

      - name: Esperar PRD na versão nova
        env:
          V: ${{ steps.v.outputs.versao }}
        run: |
          sleep 45   # o Portainer recria os contêineres; não conferir o antigo
          for i in $(seq 60); do
            J=$(curl -fsS "https://fluxgk.rstecbr.com.br/versao.json?t=$(date +%s)" || true)
            echo "$J" | grep -q "\"versao\":\"${V}\"" && { echo "no ar: $J"; break; }
            sleep 10
          done
          echo "$J" | grep -q "\"versao\":\"${V}\"" || { echo "::error::PRD não mostrou $V em 10 min (último: $J)"; exit 1; }
          curl -fsS https://fluxgk.rstecbr.com.br/api/health
          echo "### FluxGK $V em produção" >> "$GITHUB_STEP_SUMMARY"
