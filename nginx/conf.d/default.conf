# FluxGK · nginx da stack — serve o PWA e proxeia o PocketBase
# O Hestia faz o proxy do domínio para 127.0.0.1:${PORTA_HTTP} -> este container:80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512M;   # upload de vídeo do mod_video

    # ─── IP real do cliente ───
    # Quem conecta aqui é o gateway da rede do Docker (o Hestia faz o proxy pelo
    # loopback), então $remote_addr seria o mesmo IP para todo mundo — e o rate
    # limiting do PocketBase, que conta por IP, bloquearia todos juntos.
    # Confia só em endereço privado e pega, da direita para a esquerda, o primeiro
    # IP de fora: o que o Hestia acrescentou. O que o cliente forjar à esquerda
    # no X-Forwarded-For é ignorado. O PocketBase lê o resultado em X-Real-IP.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json font/woff2;

    # ─── Healthcheck da stack (é o que o Hestia/CI conferem) ───
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ─── Tempo real do PocketBase (SSE): sem buffer, sem timeout curto ───
    location = /api/realtime {
        proxy_pass http://pocketbase:8090/api/realtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── API do PocketBase ───
    location /api/ {
        proxy_pass http://pocketbase:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Painel do administrador do PocketBase (reset de senha é aqui) ───
    location /_/ {
        proxy_pass http://pocketbase:8090/_/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Fontes locais: cache longo (substituem o Google Fonts) ───
    location /static/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Adaptador fluxdb: o navegador revalida sempre (ETag → 304 barato).
    #     Sem isto, quem guardou a versão antiga no cache seguiria com ela. ───
    location = /static/pocketbase-adapter.js {
        add_header Cache-Control "no-cache";
        # add_header aqui anula os do server: repete os dois
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── PWA: manifesto e service worker nunca em cache ───
    location ~* ^/(manifest\.webmanifest|manifest\.json|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ─── As páginas são HTML servido direto (NÃO é SPA: cada módulo é um arquivo) ───
    location / {
        try_files $uri $uri/ =404;
    }
}
